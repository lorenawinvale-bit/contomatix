  <text x="144" y="70" font-size="24" font-weight="700" fill="#16192A">Contomatix</text>

  <!-- Headline block, unchanged from the previous layout -->
  <text x="662" y="120" font-size="15" font-weight="700" letter-spacing="2" fill="#0B807C">CONTENT THAT PERFORMS</text>
  <text x="660" y="175" font-size="40" font-weight="700" fill="#16192A">Crafting content that ranks</text>
  <text x="660" y="222" font-size="40" font-weight="700" fill="#0B807C">&amp; gets cited by AI</text>
  <text x="660" y="258" font-size="19" fill="#565E6E">Content strategy for organic search and AI answer engines</text>

