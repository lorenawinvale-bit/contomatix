        <stop offset="1" stop-color="#0B807C"/>
      </linearGradient>
      <linearGradient id="bnr-node" x1="30" y1="9" x2="41" y2="19" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FBBF24"/>
        <stop offset="1" stop-color="#F5A623"/>
      </linearGradient>
    </defs>
    <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="url(#bnr-ring)" stroke-width="6" stroke-linecap="round"/>
    <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.7"/>
    <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.7"/>
    <circle cx="35.52" cy="13.63" r="4.4" fill="url(#bnr-node)"/>
