<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Inter, -apple-system, sans-serif">
  <style>
    .march { animation: march 1.6s linear infinite; }
    .float-a { animation: bob 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float-b { animation: bob 4.2s ease-in-out 0.6s infinite; transform-box: fill-box; transform-origin: center; }
    .float-c { animation: bob 3.9s ease-in-out 1.1s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes march { to { stroke-dashoffset: -28; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>
  <rect width="760" height="560" fill="#FDFAF5"/>

  <!-- connection lines: Contomatix (hidden, center) feeding client-facing reports -->
  <g stroke="#D9CDBB" stroke-width="2" fill="none">
    <path d="M380 280 C 300 220, 240 190, 160 150"/>
    <path d="M380 280 C 470 210, 530 180, 600 140"/>
    <path d="M380 280 C 280 330, 220 370, 150 420"/>
    <path d="M380 280 C 480 340, 550 380, 615 415"/>
  </g>
  <g class="march" stroke="#14B8A6" stroke-width="2.5" fill="none" stroke-dasharray="7 7">
    <path d="M160 150 C 240 190, 300 220, 380 280"/>
    <path d="M600 140 C 530 180, 470 210, 380 280"/>
  </g>

  <!-- Contomatix (execution, behind the scenes) -->
  <rect x="270" y="238" width="220" height="86" rx="16" fill="#16192A"/>
  <path d="M304 275l9-9h7a2 2 0 0 1 2 2v7l-9 9a2 2 0 0 1-2.8 0l-6.2-6.2a2 2 0 0 1 0-2.8z" fill="none" stroke="#14B8A6" stroke-width="2"/>
  <text x="326" y="276" font-size="15" font-weight="700" fill="#FFFFFF">Contomatix</text>
  <text x="326" y="298" font-size="12" fill="#9AA3B8">Executing behind the scenes</text>

  <!-- client-facing report cards, each carrying the AGENCY'S own brand -->
  <g class="float-c">
    <rect x="62" y="106" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="84" y="130" width="10" height="24" rx="3" fill="#0EA5A0"/>
    <text x="104" y="138" font-size="13.5" font-weight="600" fill="#16192A">Agency A Report</text>
    <rect x="104" y="146" width="90" height="20" rx="10" fill="#E5F7F1"/>
    <text x="112" y="160" font-size="11" font-weight="700" fill="#0B807C">Their branding</text>
  </g>
  <g>
    <rect x="512" y="96" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="534" y="120" width="10" height="24" rx="3" fill="#F59E0B"/>
    <text x="554" y="128" font-size="13.5" font-weight="600" fill="#16192A">Agency B Report</text>
    <rect x="554" y="136" width="90" height="20" rx="10" fill="#E5F7F1"/>
    <text x="562" y="150" font-size="11" font-weight="700" fill="#0B807C">Their branding</text>
  </g>
  <g>
    <rect x="52" y="384" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="74" y="408" width="10" height="24" rx="3" fill="#F472B6"/>
    <text x="94" y="416" font-size="13.5" font-weight="600" fill="#16192A">Agency C Report</text>
    <rect x="94" y="424" width="90" height="20" rx="10" fill="#E5F7F1"/>
    <text x="102" y="438" font-size="11" font-weight="700" fill="#0B807C">Their branding</text>
  </g>
  <g class="float-b">
    <rect x="520" y="382" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="542" y="406" width="10" height="24" rx="3" fill="#0EA5A0"/>
    <text x="562" y="414" font-size="13.5" font-weight="600" fill="#16192A">Agency D Report</text>
    <rect x="562" y="422" width="90" height="20" rx="10" fill="#E5F7F1"/>
    <text x="570" y="436" font-size="11" font-weight="700" fill="#0B807C">Their branding</text>
  </g>

  <!-- floating stat chip -->
  <g class="float-a">
    <rect x="470" y="486" width="228" height="48" rx="24" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="498" cy="510" r="13" fill="#E5F7F1"/>
    <path d="M492 510l4 4 8-8" stroke="#0B807C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="522" y="515" font-size="13" font-weight="600" fill="#16192A">Zero Contomatix mentions</text>
  </g>
</svg>
