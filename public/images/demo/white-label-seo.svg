<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, -apple-system, sans-serif">
  <style>
    .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
    .pop  { opacity: 0; animation: pop 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: 1.2s; } .p3 { animation-delay: 2.4s; } .p4 { animation-delay: 3.6s; }
    .bob { animation: bob 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pop { 0%,8% { opacity: 0; transform: scale(0.85); } 16%,86% { opacity: 1; transform: scale(1); } 95%,100% { opacity: 0; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
  <rect width="960" height="420" fill="#FDFAF5"/>
  <text x="48" y="64" font-size="19" font-weight="700" fill="#16192A">How a white-label SEO partnership runs</text>
  <text x="48" y="88" font-size="13" fill="#8B93A3">Your brand out front, our execution behind the scenes</text>

  <g class="pop">
    <rect x="48" y="130" width="190" height="132" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <text x="70" y="162" font-size="12.5" fill="#8B93A3">1 &#183; You brief us</text>
    <circle cx="90" cy="200" r="16" fill="#E5F7F1"/>
    <text x="82" y="205" font-size="13" fill="#0B807C">A</text>
    <text x="118" y="197" font-size="12" fill="#16192A">Your Agency</text>
    <text x="118" y="213" font-size="11" fill="#8B93A3">client + goals</text>
    <rect x="70" y="228" width="146" height="20" rx="10" fill="#F3EEE3"/>
    <text x="80" y="242" font-size="10.5" fill="#565E6E">"Ranking + 3 links/mo"</text>
  </g>
  <path class="flow" d="M246 196 h60" stroke="#D8CBB8" stroke-width="2.5" fill="none"/>

  <g class="pop p2">
    <rect x="314" y="130" width="190" height="132" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <text x="336" y="162" font-size="12.5" fill="#8B93A3">2 &#183; We execute</text>
    <path d="M352 196l-9-9h7a2 2 0 0 1 2 2v7l-9 9a2 2 0 0 1-2.8 0l-6.2-6.2a2 2 0 0 1 0-2.8z" transform="translate(2 1) scale(0.9)" fill="none" stroke="#0B807C" stroke-width="2"/>
    <text x="374" y="200" font-size="12" fill="#16192A">Audit &#183; content</text>
    <text x="374" y="216" font-size="12" fill="#16192A">on-page &#183; links</text>
    <text x="336" y="248" font-size="11" fill="#8B93A3">Behind the curtain</text>
  </g>
  <path class="flow" d="M512 196 h60" stroke="#D8CBB8" stroke-width="2.5" fill="none"/>

  <g class="pop p3">
    <rect x="580" y="130" width="150" height="132" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <text x="602" y="162" font-size="12.5" fill="#8B93A3">3 &#183; Rebranded report</text>
    <rect x="600" y="182" width="110" height="60" rx="8" fill="#FFFFFF" stroke="#D8CBB8"/>
    <rect x="610" y="192" width="46" height="8" rx="4" fill="#0EA5A0"/>
    <text x="610" y="216" font-size="9.5" fill="#565E6E">Your Agency</text>
    <text x="610" y="230" font-size="9" fill="#8B93A3">Monthly SEO Report</text>
  </g>
  <path class="flow" d="M738 196 h58" stroke="#D8CBB8" stroke-width="2.5" fill="none"/>

  <g class="pop p4">
    <rect x="804" y="110" width="118" height="172" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <text x="822" y="140" font-size="12.5" fill="#8B93A3">4 &#183; Client sees</text>
    <circle cx="863" cy="192" r="17" fill="#E5F7F1"/>
    <text x="856" y="197" font-size="13" fill="#0B807C">C</text>
    <text x="822" y="228" font-size="11" fill="#16192A">Happy client</text>
    <g class="bob">
      <rect x="822" y="242" width="70" height="24" rx="12" fill="#0EA5A0"/>
      <text x="833" y="258" font-size="11" font-weight="700" fill="#FFFFFF">Your win</text>
    </g>
  </g>

  <g class="bob">
    <rect x="48" y="316" width="874" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="86" cy="344" r="5" fill="#34D399"/>
    <text x="104" y="349" font-size="13" fill="#565E6E">Zero client-facing Contomatix mentions &#183; you set the retainer &#183; we scale with your roster</text>
  </g>
</svg>
