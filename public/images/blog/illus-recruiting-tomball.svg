<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="645" cy="75" r="145" fill="rgba(20,184,166,0.06)"/>
  <circle cx="95" cy="410" r="135" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="205" cy="418" rx="165" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Tomball water tower + rail-depot motif: a small-town workforce scene, distinct from the storefront-row and skyline-laptop art used elsewhere in this series -->
  <g>
    <!-- ground line -->
    <line x1="35" y1="392" x2="360" y2="392" stroke="#EAE0D2" stroke-width="3"/>

    <!-- water tower, a genuine Tomball landmark -->
    <g transform="translate(52,230)">
      <line x1="34" y1="90" x2="34" y2="150" stroke="#8A8371" stroke-width="3"/>
      <line x1="12" y1="150" x2="34" y2="90" stroke="#8A8371" stroke-width="3"/>
      <line x1="56" y1="150" x2="34" y2="90" stroke="#8A8371" stroke-width="3"/>
      <line x1="18" y1="132" x2="50" y2="132" stroke="#8A8371" stroke-width="2"/>
      <line x1="22" y1="112" x2="46" y2="112" stroke="#8A8371" stroke-width="2"/>
      <ellipse cx="34" cy="80" rx="34" ry="14" fill="#0EA5A0"/>
      <path d="M0 80 a34 30 0 0 0 68 0 v20 a34 30 0 0 1 -68 0 z" fill="#0EA5A0"/>
      <ellipse cx="34" cy="100" rx="34" ry="14" fill="#0B807C"/>
      <text x="34" y="86" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TOMBALL</text>
    </g>

    <!-- rail depot building, nodding to Tomball's historic railroad-town roots -->
    <g transform="translate(150,300)">
      <rect x="0" y="30" width="130" height="62" fill="#FFFFFF" stroke="#16192A" stroke-width="1.5"/>
      <polygon points="-8,30 138,30 65,4" fill="#F5A623" opacity="0.9"/>
      <rect x="56" y="60" width="20" height="32" fill="#FDF3E2" stroke="#F5A623" stroke-width="1.5"/>
      <g stroke="#16192A" stroke-width="1" opacity="0.4">
        <rect x="12" y="42" width="18" height="18" fill="none"/>
        <rect x="100" y="42" width="18" height="18" fill="none"/>
      </g>
      <rect x="-16" y="90" width="164" height="6" fill="#EAE0D2"/>
    </g>

    <!-- small trees -->
    <circle cx="120" cy="382" r="9" fill="#0EA5A0" opacity="0.5"/>
    <rect x="118" y="388" width="4" height="8" fill="#8A8371"/>
    <circle cx="345" cy="380" r="9" fill="#0EA5A0" opacity="0.5"/>
    <rect x="343" y="386" width="4" height="8" fill="#8A8371"/>
  </g>

  <!-- workforce / hiring figures, tying the small-town scene to a recruiting theme -->
  <g fill="#0EA5A0" opacity="0.85">
    <circle cx="285" cy="345" r="8"/><path d="M271 372 Q285 356 299 372 Z"/>
    <circle cx="313" cy="345" r="8"/><path d="M299 372 Q313 356 327 372 Z"/>
  </g>

  <!-- ranked list card, honest count of 2 -->
  <g>
    <rect x="118" y="150" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="134" cy="163" r="9" fill="#0EA5A0"/>
    <text x="134" y="167" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="152" y="157" width="140" height="10" rx="5" fill="#F1EDE3"/>
  </g>
  <g>
    <rect x="118" y="184" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="134" cy="197" r="9" fill="#F5A623"/>
    <text x="134" y="201" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <rect x="152" y="191" width="118" height="10" rx="5" fill="#F1EDE3"/>
  </g>

  <!-- magnifying glass over an address pin, a verification motif -->
  <g transform="translate(300,205)">
    <path d="M8 26 L2 40 L14 40 Z" fill="#F59E0B"/>
    <circle cx="8" cy="14" r="14" fill="#F5A623"/>
    <circle cx="8" cy="14" r="6" fill="#FDFAF5"/>
    <circle cx="26" cy="8" r="11" fill="none" stroke="#16192A" stroke-width="2.4"/>
    <line x1="34" y1="16" x2="42" y2="24" stroke="#16192A" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="438" y="180" width="272" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="464" cy="206" r="12" fill="#E5F7F1"/>
    <path d="M458 206l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="483" y="202" font-size="12.5" font-weight="700" fill="#16192A">Hand-checked, not scraped</text>
    <text x="483" y="219" font-size="11" fill="#8A8371">real Tomball addresses verified</text>
  </g>
  <g>
    <rect x="438" y="242" width="272" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="464" cy="268" r="12" fill="#FDF3E2"/>
    <path d="M464 261v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="483" y="264" font-size="12.5" font-weight="700" fill="#16192A">2 of 16 candidates verified</text>
    <text x="483" y="281" font-size="11" fill="#8A8371">small, fast-growing Houston exurb</text>
  </g>

  <text x="35" y="440" font-size="17" font-weight="700" fill="#16192A">Top 2 Recruiting Companies in Tomball</text>
</svg>
