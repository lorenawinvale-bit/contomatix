    <text x="437" y="357" font-size="11.5" font-weight="700" fill="#8A8371" text-anchor="middle">Publisher page</text>
    <text x="437" y="373" font-size="10" fill="#8A8371" text-anchor="middle">the click it used to get</text>
  </g>

  <!-- new path: Dive deeper -> Google-hosted AI summary -->
  <path d="M275 272 C 330 272, 340 225, 400 225" stroke="#0EA5A0" stroke-width="2.5" fill="none"/>
  <polygon points="398,219 412,225 398,231" fill="#0EA5A0"/>

  <g>
    <rect x="416" y="140" width="290" height="170" rx="16" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2.5"/>
    <text x="436" y="166" font-size="10.5" font-weight="700" fill="#0B807C">GOOGLE-HOSTED AI SUMMARY</text>
    <rect x="436" y="180" width="240" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="436" y="196" width="220" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="436" y="212" width="180" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="436" y="240" width="72" height="42" rx="8" fill="#F6F2EA" stroke="#EAE0D2"/>
    <rect x="514" y="240" width="72" height="42" rx="8" fill="#F6F2EA" stroke="#EAE0D2"/>
    <rect x="592" y="240" width="72" height="42" rx="8" fill="#F6F2EA" stroke="#EAE0D2"/>
    <text x="436" y="298" font-size="9.5" fill="#8A8371">small link cards to sources</text>
  </g>

  <text x="70" y="425" font-size="20" font-weight="700" fill="#16192A">Google Tests "Dive Deeper" in Discover</text>
