      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <rect x="596" y="34" width="120" height="28" rx="14" fill="#FDF3E2" stroke="#F5A623"/>
  <text x="656" y="52" font-size="11" font-weight="700" fill="#B5730E" text-anchor="middle">SEO NEWS · SEP 2026</text>

  <!-- a Discover-style card with two tap targets -->
  <g>
    <rect x="70" y="120" width="220" height="190" rx="16" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <rect x="86" y="136" width="188" height="70" rx="10" fill="#F1EDE3"/>
    <polygon points="164,156 164,186 190,171" fill="#C9BBA9"/>
    <rect x="86" y="218" width="150" height="8" rx="4" fill="#E2D8C6"/>
    <rect x="86" y="234" width="110" height="8" rx="4" fill="#E2D8C6"/>

    <rect x="86" y="256" width="86" height="32" rx="16" fill="#FFFFFF" stroke="#C9BBA9" stroke-width="1.5"/>
    <text x="129" y="276" font-size="11" font-weight="700" fill="#8A8371" text-anchor="middle">Open article</text>

    <rect x="180" y="256" width="94" height="32" rx="16" fill="#0EA5A0"/>
    <text x="227" y="276" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dive deeper</text>
  </g>

  <!-- normal path to the publisher: dashed, dimmed -->
  <path d="M129 288 C 129 350, 300 360, 372 360" stroke="#C9BBA9" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <g opacity="0.85">
