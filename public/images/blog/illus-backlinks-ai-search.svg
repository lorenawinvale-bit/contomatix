<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- chat bubble representing an AI answer -->
  <g>
    <path d="M120 190 h300 a20 20 0 0 1 20 20 v110 a20 20 0 0 1 -20 20 h-220 l-40 35 v-35 h-40 a20 20 0 0 1 -20 -20 v-110 a20 20 0 0 1 20 -20 Z" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2.5"/>
    <circle cx="150" cy="222" r="9" fill="#0EA5A0"/>
    <rect x="170" y="215" width="120" height="14" rx="7" fill="#E5F7F1"/>
    <rect x="150" y="245" width="270" height="10" rx="5" fill="#F1EDE3"/>
    <rect x="150" y="263" width="230" height="10" rx="5" fill="#F1EDE3"/>
    <!-- citation chips inside the answer -->
    <rect x="150" y="288" width="86" height="24" rx="12" fill="#FDF3E2" stroke="#F5A623"/>
    <text x="164" y="304" font-size="10.5" font-weight="700" fill="#B5730E">Source [1]</text>
    <rect x="244" y="288" width="86" height="24" rx="12" fill="#E5F7F1" stroke="#0EA5A0"/>
    <text x="258" y="304" font-size="10.5" font-weight="700" fill="#0B807C">Source [2]</text>
  </g>

  <!-- backlink chain feeding into the bubble -->
  <g stroke="#0EA5A0" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M480 150 a16 16 0 1 1 22 22 l-12 12"/>
    <path d="M502 172 a16 16 0 1 1 -22 -22 l12 -12" transform="translate(24,24)"/>
  </g>
  <g stroke="#F5A623" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M555 230 a16 16 0 1 1 22 22 l-12 12"/>
    <path d="M577 252 a16 16 0 1 1 -22 -22 l12 -12" transform="translate(24,24)"/>
  </g>
  <path d="M470 200 q-45 30 -60 45" stroke="#C9BBA9" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <path d="M552 288 q-70 15 -100 15" stroke="#C9BBA9" stroke-width="2" fill="none" stroke-dasharray="5 5"/>

  <!-- floating cards -->
  <g>
    <rect x="470" y="310" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="496" cy="336" r="12" fill="#E5F7F1"/>
    <path d="M490 336l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="515" y="332" font-size="12.5" font-weight="700" fill="#16192A">Brand mentions + links</text>
    <text x="515" y="349" font-size="11" fill="#8A8371">both feed AI citations</text>
  </g>
  <g>
    <rect x="470" y="372" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="496" cy="398" r="12" fill="#FDF3E2"/>
    <path d="M496 391v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="515" y="394" font-size="12.5" font-weight="700" fill="#16192A">Quality over quantity</text>
    <text x="515" y="411" font-size="11" fill="#8A8371">editorial links still count</text>
  </g>

  <text x="60" y="458" font-size="20" font-weight="700" fill="#16192A">Backlinks in the Age of AI Search</text>
</svg>
