<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="645" cy="75" r="145" fill="rgba(20,184,166,0.06)"/>
  <circle cx="95" cy="410" r="135" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="215" cy="422" rx="175" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Chamber-of-Commerce community bulletin board / kiosk motif, distinct from the storefront-street (SEO)
       and laptop-dashboard (digital marketing) illustrations used on the sibling Tomball posts -->
  <g>
    <!-- kiosk posts -->
    <rect x="82" y="248" width="10" height="150" fill="#8A8371"/>
    <rect x="298" y="248" width="10" height="150" fill="#8A8371"/>
    <!-- roof -->
    <polygon points="64,248 326,248 306,214 84,214" fill="#0B807C"/>
    <polygon points="64,248 326,248 316,258 74,258" fill="#0EA5A0" opacity="0.85"/>

    <!-- corkboard panel -->
    <rect x="72" y="262" width="246" height="128" rx="6" fill="#FDF3E2" stroke="#C9BBA9" stroke-width="2"/>

    <!-- board header strip -->
    <rect x="72" y="262" width="246" height="24" rx="6" fill="#16192A"/>
    <text x="94" y="278" font-size="11" font-weight="700" fill="#FFFFFF">ADVERTISING &amp; MEDIA DIRECTORY</text>

    <!-- three pinned member cards on the board, echoing the honest-count-of-3 theme -->
    <g>
      <rect x="86" y="296" width="66" height="46" rx="4" fill="#FFFFFF" stroke="#EAE0D2"/>
      <circle cx="119" cy="296" r="4" fill="#EF4444"/>
      <rect x="94" y="306" width="50" height="7" rx="2" fill="#0EA5A0"/>
      <rect x="94" y="318" width="38" height="6" rx="2" fill="#E5D9C8"/>
      <rect x="94" y="328" width="42" height="6" rx="2" fill="#E5D9C8"/>
    </g>
    <g>
      <rect x="163" y="296" width="66" height="46" rx="4" fill="#FFFFFF" stroke="#EAE0D2"/>
      <circle cx="196" cy="296" r="4" fill="#F5A623"/>
      <rect x="171" y="306" width="50" height="7" rx="2" fill="#F5A623"/>
      <rect x="171" y="318" width="38" height="6" rx="2" fill="#E5D9C8"/>
      <rect x="171" y="328" width="42" height="6" rx="2" fill="#E5D9C8"/>
    </g>
    <g>
      <rect x="240" y="296" width="66" height="46" rx="4" fill="#FFFFFF" stroke="#EAE0D2"/>
      <circle cx="273" cy="296" r="4" fill="#0B807C"/>
      <rect x="248" y="306" width="50" height="7" rx="2" fill="#0B807C"/>
      <rect x="248" y="318" width="38" height="6" rx="2" fill="#E5D9C8"/>
      <rect x="248" y="328" width="42" height="6" rx="2" fill="#E5D9C8"/>
    </g>

    <!-- greyed-out "everyone else" rows underneath, representing the other 26 directory members that are
         sign shops, print, hosting, or out-of-town, faded to show they were checked and set aside -->
    <rect x="86" y="352" width="220" height="8" rx="4" fill="#E5D9C8" opacity="0.6"/>
    <rect x="86" y="366" width="180" height="8" rx="4" fill="#E5D9C8" opacity="0.5"/>
    <rect x="86" y="380" width="200" height="8" rx="4" fill="#E5D9C8" opacity="0.4"/>
  </g>

  <!-- magnifying glass verifying the board, cross-check motif -->
  <g transform="translate(300,330)">
    <circle cx="0" cy="0" r="30" fill="rgba(253,250,245,0.9)" stroke="#16192A" stroke-width="4"/>
    <line x1="21" y1="21" x2="42" y2="42" stroke="#16192A" stroke-width="7" stroke-linecap="round"/>
    <path d="M-14 0 l8 8 l14 -16" fill="none" stroke="#0EA5A0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- a small cluster of three simple building icons floating to the right, the "3 agencies" visual -->
  <g transform="translate(430,300)">
    <rect x="0" y="26" width="46" height="70" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2"/>
    <polygon points="-6,26 52,26 23,4" fill="#0EA5A0"/>
    <rect x="14" y="70" width="18" height="26" fill="#E5F7F1" stroke="#0B807C" stroke-width="1.5"/>
    <rect x="8" y="38" width="10" height="12" fill="#E5F7F1"/>
    <rect x="28" y="38" width="10" height="12" fill="#E5F7F1"/>

    <rect x="58" y="10" width="52" height="86" fill="#FDF3E2" stroke="#F5A623" stroke-width="2"/>
    <polygon points="51,10 117,10 84,-16" fill="#F5A623"/>
    <rect x="76" y="62" width="18" height="34" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.5"/>
    <rect x="66" y="24" width="10" height="12" fill="#FFFFFF"/>
    <rect x="94" y="24" width="10" height="12" fill="#FFFFFF"/>
    <rect x="66" y="42" width="10" height="12" fill="#FFFFFF"/>
    <rect x="94" y="42" width="10" height="12" fill="#FFFFFF"/>

    <rect x="122" y="34" width="42" height="62" fill="#FFFFFF" stroke="#16192A" stroke-width="2"/>
    <polygon points="117,34 169,34 143,14" fill="#16192A"/>
    <rect x="135" y="72" width="16" height="24" fill="#F1EDE3" stroke="#16192A" stroke-width="1.5"/>
    <rect x="128" y="46" width="10" height="12" fill="#F1EDE3"/>
    <rect x="148" y="46" width="10" height="12" fill="#F1EDE3"/>
  </g>

  <!-- briefcase icon, agency/services motif -->
  <g transform="translate(560,230)">
    <rect x="-24" y="-6" width="48" height="34" rx="5" fill="#FFFFFF" stroke="#16192A" stroke-width="2.4"/>
    <rect x="-24" y="-6" width="48" height="10" fill="#0EA5A0"/>
    <path d="M-10 -6 v-8 a6 6 0 0 1 6 -6 h8 a6 6 0 0 1 6 6 v8" fill="none" stroke="#16192A" stroke-width="2.4"/>
    <line x1="-24" y1="10" x2="24" y2="10" stroke="#16192A" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="392" y="60" width="290" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="418" cy="86" r="12" fill="#E5F7F1"/>
    <path d="M412 86l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="437" y="82" font-size="12.5" font-weight="700" fill="#16192A">Cross-checked against the Chamber</text>
    <text x="437" y="99" font-size="11" fill="#8A8371">29 directory members, only 3 qualify</text>
  </g>
  <g>
    <rect x="392" y="126" width="290" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="418" cy="152" r="12" fill="#FDF3E2"/>
    <path d="M413 152a5 5 0 1 1 10 0a5 5 0 1 1 -10 0" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M418 147v10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="437" y="148" font-size="12.5" font-weight="700" fill="#16192A">Same 3 shops, honestly disclosed</text>
    <text x="437" y="165" font-size="11" fill="#8A8371">Tomball's agency market is simply this small</text>
  </g>

  <text x="60" y="440" font-size="17" font-weight="700" fill="#16192A">Top 3 Marketing Agencies in Tomball</text>
</svg>
