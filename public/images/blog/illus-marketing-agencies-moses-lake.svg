<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- Moses Lake motif: the lake itself, a small Main Street skyline, and a nod to the
       Grant County / Larson Air Force Base flight-test runway alongside the agricultural
       fields that dominate the local economy -->
  <g transform="translate(40,130)">
    <!-- lake water -->
    <ellipse cx="180" cy="230" rx="200" ry="52" fill="#0EA5A0" opacity="0.14"/>
    <path d="M-20 226 Q60 210 140 224 T300 222 T380 232" fill="none" stroke="#0EA5A0" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M-10 244 Q70 230 150 242 T310 240 T380 248" fill="none" stroke="#0EA5A0" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

    <!-- reflection shimmer -->
    <g fill="#F5A623" opacity="0.7">
      <circle cx="150" cy="236" r="2.4"/>
      <circle cx="196" cy="228" r="2"/>
      <circle cx="228" cy="240" r="2.6"/>
    </g>

    <!-- small Main Street row of buildings along the shore -->
    <g>
      <rect x="30" y="150" width="34" height="60" fill="#C9682B"/>
      <rect x="68" y="130" width="30" height="80" fill="#16192A" opacity="0.75"/>
      <rect x="102" y="158" width="28" height="52" fill="#0B807C"/>
      <rect x="134" y="140" width="32" height="70" fill="#C9682B" opacity="0.85"/>
      <rect x="170" y="164" width="26" height="46" fill="#16192A" opacity="0.6"/>
      <!-- simple windows -->
      <g fill="#FDFAF5" opacity="0.85">
        <rect x="38" y="162" width="8" height="10"/>
        <rect x="50" y="162" width="8" height="10"/>
        <rect x="76" y="144" width="7" height="9"/>
        <rect x="76" y="160" width="7" height="9"/>
        <rect x="110" y="170" width="7" height="9"/>
        <rect x="142" y="154" width="8" height="9"/>
        <rect x="142" y="170" width="8" height="9"/>
      </g>
    </g>

    <!-- field rows suggesting the surrounding agricultural land -->
    <g stroke="#0B807C" stroke-width="3" opacity="0.25" stroke-linecap="round">
      <line x1="10" y1="290" x2="90" y2="290"/>
      <line x1="10" y1="300" x2="95" y2="300"/>
      <line x1="10" y1="310" x2="88" y2="310"/>
      <line x1="10" y1="320" x2="92" y2="320"/>
    </g>

    <!-- distant aircraft on approach, a nod to the Grant County International Airport /
         Boeing flight-test runway -->
    <g transform="translate(250,60)" fill="none" stroke="#16192A" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
      <path d="M0 20 L60 20 M20 20 L34 2 M40 20 L52 34 M26 20 L26 8"/>
    </g>
    <g stroke="#16192A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.35">
      <path d="M270 46 q8 -8 16 0 q8 -8 16 0"/>
    </g>
  </g>

  <ellipse cx="230" cy="400" rx="175" ry="14" fill="rgba(23,20,44,0.06)"/>

  <g stroke="#14B8A6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300 268 Q322 262 340 250"/>
    <path d="M306 285 Q330 285 348 280"/>
  </g>
  <g fill="#F5A623" opacity="0.8">
    <circle cx="358" cy="248" r="4"/>
    <circle cx="352" cy="290" r="4"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="150" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
    <path d="M460 176l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">2 agencies, independently verified</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">real Moses Lake offices only</text>
  </g>
  <g>
    <rect x="440" y="212" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M460 238h12M466 232v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">27 candidates reviewed</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">most fell short of full-service</text>
  </g>

  <text x="40" y="428" font-size="16.5" font-weight="700" fill="#16192A">Top Marketing Agencies in Moses Lake 2026</text>
</svg>
