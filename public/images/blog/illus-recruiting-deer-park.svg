<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="245" cy="405" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Deer Park recruiting motif: Houston Ship Channel petrochemical corridor, a dark refinery/tank-farm silhouette with a flare stack behind a narrow band of channel water, paired with a handshake card representing recruiting/placement -->
  <g transform="translate(50,130)">
    <!-- ship channel water band -->
    <g opacity="0.95">
      <path d="M-10 150 Q40 138 90 150 T190 150 T290 150 L290 195 L-10 195 Z" fill="rgba(14,165,160,0.16)"/>
      <path d="M-10 164 Q40 156 90 164 T190 164 T290 164 L290 195 L-10 195 Z" fill="rgba(14,165,160,0.24)"/>
      <path d="M-10 178 Q40 172 90 178 T190 178 T290 178 L290 195 L-10 195 Z" fill="rgba(11,128,124,0.22)"/>
      <!-- gentle channel ripples -->
      <g stroke="#0EA5A0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
        <path d="M10 140 Q22 136 34 140 T58 140"/>
        <path d="M150 132 Q162 128 174 132 T198 132"/>
      </g>
      <!-- refinery / tank-farm silhouette on the far shore: storage tanks, distillation towers, and a lit flare stack -->
      <g transform="translate(150,-6)" opacity="0.62">
        <!-- storage tanks -->
        <circle cx="8" cy="86" r="11" fill="#6b6459"/>
        <ellipse cx="8" cy="75" rx="11" ry="2.4" fill="#544e44"/>
        <circle cx="28" cy="90" r="8" fill="#6b6459"/>
        <ellipse cx="28" cy="82" rx="8" ry="1.9" fill="#544e44"/>
        <!-- distillation tower with trays -->
        <rect x="46" y="46" width="9" height="50" fill="#6b6459"/>
        <rect x="43" y="52" width="15" height="3" fill="#544e44"/>
        <rect x="43" y="64" width="15" height="3" fill="#544e44"/>
        <rect x="43" y="76" width="15" height="3" fill="#544e44"/>
        <!-- pipe rack across the base -->
        <rect x="-6" y="96" width="102" height="4" fill="#8A7A5C"/>
        <line x1="4" y1="96" x2="4" y2="88" stroke="#8A7A5C" stroke-width="2"/>
        <line x1="70" y1="96" x2="70" y2="88" stroke="#8A7A5C" stroke-width="2"/>
        <!-- second tower -->
        <rect x="70" y="58" width="7" height="38" fill="#6b6459"/>
        <circle cx="73.5" cy="54" r="4.5" fill="#6b6459"/>
        <!-- flare stack with flame -->
        <line x1="90" y1="96" x2="90" y2="30" stroke="#6b6459" stroke-width="3"/>
        <path d="M90 30 Q84 20 90 12 Q96 20 90 30 Z" fill="#F5A623"/>
        <path d="M90 24 Q87 18 90 12 Q93 18 90 24 Z" fill="#FDE68A"/>
      </g>
      <!-- small tug/work boat, nod to Ship Channel traffic -->
      <g transform="translate(110,118)" opacity="0.75">
        <path d="M0 26 L30 26 L25 33 L5 33 Z" fill="#8A7A5C"/>
        <rect x="10" y="12" width="10" height="14" fill="#6b6459"/>
        <rect x="12" y="8" width="6" height="5" fill="#EAE0D2"/>
      </g>
    </g>

    <!-- handshake card, foreground: recruiting/placement motif -->
    <g transform="translate(6,-4)">
      <rect x="0" y="0" width="126" height="86" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <g transform="translate(20,26)">
        <!-- left arm/sleeve -->
        <path d="M0 30 L26 14 L34 14 L34 24 L26 24 L14 32 Z" fill="#0EA5A0"/>
        <!-- right arm/sleeve -->
        <path d="M86 30 L60 14 L52 14 L52 24 L60 24 L72 32 Z" fill="#F5A623"/>
        <!-- clasped hands -->
        <path d="M34 20 L40 16 L46 20 L52 16 L52 26 L46 30 L40 30 L34 26 Z" fill="#16192A"/>
        <circle cx="40" cy="23" r="2.1" fill="#FDFAF5"/>
        <circle cx="46" cy="23" r="2.1" fill="#FDFAF5"/>
      </g>
      <rect x="18" y="66" width="90" height="6" rx="3" fill="rgba(23,20,44,0.12)"/>
    </g>
  </g>

  <g stroke="#14B8A6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300 258 Q322 252 340 240"/>
    <path d="M306 275 Q330 275 348 270"/>
    <path d="M300 292 Q322 302 336 310"/>
  </g>
  <g fill="#F5A623" opacity="0.8">
    <circle cx="358" cy="238" r="4"/>
    <circle cx="372" cy="268" r="5"/>
    <circle cx="352" cy="306" r="4"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="440" y="150" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
    <path d="M460 176l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">5 agencies, hand-verified</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">2 local firms + 3 disclosed branches</text>
  </g>
  <g>
    <rect x="440" y="212" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M460 238h12M466 232v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">Ship Channel industrial staffing</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">Franchise/corporate status disclosed</text>
  </g>

  <text x="50" y="428" font-size="15.5" font-weight="700" fill="#16192A">Top Recruiting Companies in Deer Park, TX</text>
</svg>
