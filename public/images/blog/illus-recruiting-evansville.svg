  <g>
    <rect x="440" y="242" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="268" r="12" fill="#FDF3E2"/>
    <path d="M466 261v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="264" font-size="12.5" font-weight="700" fill="#16192A">Ohio River Tri-State region</text>
    <text x="485" y="281" font-size="11" fill="#8A8371">manufacturing &amp; industrial hub</text>
  </g>

  <text x="60" y="425" font-size="17" font-weight="700" fill="#16192A">Top Recruiting Companies in Evansville</text>
