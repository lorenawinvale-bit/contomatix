      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Ohio River bend with a barge, Tri-State manufacturing skyline behind it -->
  <path d="M40 372 Q220 398 360 372 T680 366 L680 396 L40 396 Z" fill="#E5F7F1"/>
  <g fill="none" stroke="#0EA5A0" stroke-width="3" opacity="0.45">
    <path d="M70 362 Q230 384 360 362 T650 356"/>
  </g>
  <!-- river barge -->
  <g>
    <rect x="380" y="352" width="86" height="16" rx="3" fill="#8A8371"/>
    <rect x="392" y="340" width="18" height="14" fill="#C9BBA9"/>
    <rect x="416" y="336" width="12" height="18" fill="#B8A896"/>
    <rect x="434" y="340" width="18" height="14" fill="#C9BBA9"/>
  </g>
  <!-- manufacturing / assembly-plant skyline (Toyota-style plant + BWXT-style works) -->
  <g>
    <rect x="140" y="298" width="20" height="68" fill="#C9BBA9"/>
    <rect x="164" y="316" width="70" height="50" fill="#EFE7D8" stroke="#B8A896" stroke-width="1.5"/>
    <path d="M164 316 L199 292 L234 316 Z" fill="#B8A896"/>
    <rect x="244" y="282" width="16" height="84" fill="#B8A896"/>
    <circle cx="252" cy="274" r="8" fill="none" stroke="#B8A896" stroke-width="3"/>
    <!-- smokestack with light haze -->
    <rect x="272" y="300" width="10" height="66" fill="#9C8D7C"/>
    <ellipse cx="277" cy="292" rx="10" ry="6" fill="#EDE7DC" opacity="0.8"/>
    <!-- storage tanks -->
    <rect x="98" y="338" width="28" height="28" rx="2" fill="#FFFFFF" stroke="#B8A896" stroke-width="2"/>
    <rect x="98" y="338" width="28" height="6" fill="#B8A896"/>
  </g>

  <!-- info card baseline people mark -->
  <g>
    <rect x="90" y="150" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="106" cy="163" r="9" fill="#0EA5A0"/>
    <text x="106" y="167" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="124" y="157" width="140" height="10" rx="5" fill="#F1EDE3"/>
  </g>
  <g fill="#0EA5A0" opacity="0.85">
    <circle cx="120" cy="215" r="7"/><path d="M108 238 Q120 224 132 238 Z"/>
    <circle cx="150" cy="215" r="7"/><path d="M138 238 Q150 224 162 238 Z"/>
    <circle cx="180" cy="215" r="7"/><path d="M168 238 Q180 224 192 238 Z"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="180" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="206" r="12" fill="#E5F7F1"/>
    <path d="M460 206l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="202" font-size="12.5" font-weight="700" fill="#16192A">Hand-checked, not scraped</text>
    <text x="485" y="219" font-size="11" fill="#8A8371">real Evansville offices verified</text>
