<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="90" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="90" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- gear (automation) -->
  <g transform="translate(150,150)">
    <circle cx="60" cy="60" r="46" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <g fill="#0EA5A0">
      <rect x="52" y="4" width="16" height="18" rx="3"/>
      <rect x="52" y="98" width="16" height="18" rx="3"/>
      <rect x="4" y="52" width="18" height="16" rx="3"/>
      <rect x="98" y="52" width="18" height="16" rx="3"/>
      <rect x="20" y="20" width="16" height="16" rx="3" transform="rotate(45 28 28)"/>
      <rect x="84" y="20" width="16" height="16" rx="3" transform="rotate(45 92 28)"/>
      <rect x="20" y="84" width="16" height="16" rx="3" transform="rotate(45 28 92)"/>
      <rect x="84" y="84" width="16" height="16" rx="3" transform="rotate(45 92 92)"/>
    </g>
    <circle cx="60" cy="60" r="30" fill="#E5F7F1"/>
    <circle cx="60" cy="60" r="14" fill="#0EA5A0"/>
    <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
  </g>

  <!-- dashed flow from gear to website card -->
  <path d="M270 210 q60 -10 110 5" stroke="#C9BBA9" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <!-- chain links along the flow -->
  <g stroke="#0EA5A0" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300 195 a14 14 0 1 1 20 20 l-10 10"/>
    <path d="M320 215 a14 14 0 1 1 -20 -20 l10 -10" transform="translate(20,20)"/>
  </g>

  <!-- website / SERP card -->
  <g>
    <rect x="400" y="150" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <circle cx="422" cy="172" r="5" fill="#EAE0D2"/>
    <circle cx="438" cy="172" r="5" fill="#EAE0D2"/>
    <circle cx="454" cy="172" r="5" fill="#EAE0D2"/>
    <rect x="418" y="192" width="160" height="10" rx="3" fill="#16192A"/>
    <rect x="418" y="210" width="230" height="7" rx="3" fill="#C9BBA9"/>
    <rect x="418" y="224" width="200" height="7" rx="3" fill="#C9BBA9"/>
    <rect x="418" y="248" width="120" height="24" rx="12" fill="#E5F7F1"/>
    <text x="432" y="264" font-size="11" font-weight="700" fill="#0B807C">Ranking signal</text>
  </g>

  <!-- gauge: manipulative (risk) to earned (safe) -->
  <g transform="translate(430,330)">
    <path d="M0 60 A60 60 0 0 1 120 60" fill="none" stroke="#FBD9C4" stroke-width="14" stroke-linecap="round"/>
    <path d="M0 60 A60 60 0 0 1 46 4" fill="none" stroke="#F5A623" stroke-width="14" stroke-linecap="round"/>
    <path d="M74 4 A60 60 0 0 1 120 60" fill="none" stroke="#0EA5A0" stroke-width="14" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="90" y2="16" stroke="#16192A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="6" fill="#16192A"/>
    <text x="-8" y="78" font-size="10.5" fill="#8A8371">Manipulative</text>
    <text x="92" y="78" font-size="10.5" fill="#8A8371">Earned</text>
  </g>

  <ellipse cx="200" cy="430" rx="150" ry="10" fill="rgba(23,20,44,0.05)"/>

  <!-- floating cards -->
  <g>
    <rect x="40" y="290" width="240" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="66" cy="317" r="12" fill="#FDF3E2"/>
    <path d="M66 310v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="86" y="313" font-size="12.5" font-weight="700" fill="#16192A">Google's link spam policy</text>
    <text x="86" y="330" font-size="11" fill="#8A8371">flags links built to manipulate rank</text>
  </g>
  <g>
    <rect x="40" y="352" width="240" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="66" cy="379" r="12" fill="#E5F7F1"/>
    <path d="M60 379l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="375" font-size="12.5" font-weight="700" fill="#16192A">Hybrid approach wins</text>
    <text x="86" y="392" font-size="11" fill="#8A8371">automate research, not outreach</text>
  </g>

  <text x="40" y="455" font-size="20" font-weight="700" fill="#16192A">Automated Link Building</text>
</svg>
