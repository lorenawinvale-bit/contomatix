<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- Four-step sequence, stacked, showing order matters -->
  <g>
    <rect x="140" y="120" width="330" height="36" rx="10" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="1.5"/>
    <circle cx="160" cy="138" r="10" fill="#0EA5A0"/>
    <text x="160" y="142" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="180" y="142" font-size="13" font-weight="700" fill="#16192A">Crawlability &amp; indexation</text>

    <rect x="170" y="164" width="330" height="36" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <circle cx="190" cy="182" r="10" fill="#14B8A6"/>
    <text x="190" y="186" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="210" y="186" font-size="13" font-weight="700" fill="#16192A">Structure for extraction</text>

    <rect x="200" y="208" width="330" height="36" rx="10" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.5"/>
    <circle cx="220" cy="226" r="10" fill="#F5A623"/>
    <text x="220" y="230" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="240" y="230" font-size="13" font-weight="700" fill="#16192A">Citation-worthy signals</text>

    <rect x="230" y="252" width="330" height="36" rx="10" fill="#FFFFFF" stroke="#C9BBA9" stroke-width="1.5"/>
    <circle cx="250" cy="270" r="10" fill="#8A8371"/>
    <text x="250" y="274" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="270" y="274" font-size="13" font-weight="700" fill="#16192A">Track from day one</text>
  </g>

  <!-- floating callout cards -->
  <g>
    <rect x="500" y="200" width="205" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="526" cy="226" r="12" fill="#E5F7F1"/>
    <path d="M520 226l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="545" y="222" font-size="12.5" font-weight="700" fill="#16192A">One sequence</text>
    <text x="545" y="239" font-size="11" fill="#8A8371">not four projects</text>
  </g>

  <text x="140" y="360" font-size="20" font-weight="700" fill="#16192A">AI SEO Strategy</text>
</svg>
