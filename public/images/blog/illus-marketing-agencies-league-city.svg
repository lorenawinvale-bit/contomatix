<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="645" cy="75" r="145" fill="rgba(20,184,166,0.06)"/>
  <circle cx="95" cy="410" r="135" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="205" cy="422" rx="175" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Business-park office motif, distinct from Tomball's Chamber-bulletin-board and Cypress's
       cul-de-sac motif: a single confirmed office building inside a business park, echoing
       League City's honest Top-1 count and Empire Creative Marketing's real Brittany Business
       Park street address. -->
  <g>
    <!-- business park lot / pavement -->
    <rect x="60" y="330" width="290" height="70" fill="#E9E2D4"/>
    <rect x="60" y="330" width="290" height="8" fill="#C9BBA9"/>
    <!-- parking stripes -->
    <line x1="90" y1="345" x2="90" y2="392" stroke="#FDFAF5" stroke-width="3"/>
    <line x1="120" y1="345" x2="120" y2="392" stroke="#FDFAF5" stroke-width="3"/>
    <line x1="150" y1="345" x2="150" y2="392" stroke="#FDFAF5" stroke-width="3"/>

    <!-- the one confirmed office building -->
    <g transform="translate(150,196)">
      <rect x="0" y="40" width="130" height="94" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2.6"/>
      <rect x="0" y="40" width="130" height="14" fill="#0B807C"/>
      <rect x="14" y="66" width="22" height="20" fill="#E5F7F1" stroke="#0B807C" stroke-width="1.4"/>
      <rect x="54" y="66" width="22" height="20" fill="#E5F7F1" stroke="#0B807C" stroke-width="1.4"/>
      <rect x="94" y="66" width="22" height="20" fill="#E5F7F1" stroke="#0B807C" stroke-width="1.4"/>
      <rect x="52" y="100" width="26" height="34" fill="#E5F7F1" stroke="#0B807C" stroke-width="1.5"/>
      <!-- suite sign -->
      <rect x="30" y="140" width="70" height="18" rx="3" fill="#16192A"/>
      <text x="65" y="153" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1145 BUTLER RD</text>
    </g>

    <!-- greyed-out "everyone else" faded storefronts further back, representing the contested,
         out-of-town, and service-area-only listings checked and set aside -->
    <rect x="70" y="372" width="150" height="8" rx="4" fill="#E5D9C8" opacity="0.6"/>
    <rect x="70" y="386" width="110" height="8" rx="4" fill="#E5D9C8" opacity="0.5"/>
  </g>

  <!-- two chamber-of-commerce membership badges stacked beside the building, the "two chambers"
       verification signal that set this candidate apart from the excluded, contested addresses -->
  <g transform="translate(300,225)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#F5A623" stroke-width="3"/>
    <path d="M-10 1l6 6 12-14" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(322,258)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="3"/>
    <path d="M-8 1l5 5 10-12" fill="none" stroke="#0B807C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- magnifying glass verifying the two chamber directories, cross-check motif -->
  <g transform="translate(390,330)">
    <circle cx="0" cy="0" r="30" fill="rgba(253,250,245,0.9)" stroke="#16192A" stroke-width="4"/>
    <line x1="21" y1="21" x2="42" y2="42" stroke="#16192A" stroke-width="7" stroke-linecap="round"/>
    <path d="M-14 0 l8 8 l14 -16" fill="none" stroke="#0EA5A0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- briefcase icon, agency/services motif -->
  <g transform="translate(560,230)">
    <rect x="-24" y="-6" width="48" height="34" rx="5" fill="#FFFFFF" stroke="#16192A" stroke-width="2.4"/>
    <rect x="-24" y="-6" width="48" height="10" fill="#0EA5A0"/>
    <path d="M-10 -6 v-8 a6 6 0 0 1 6 -6 h8 a6 6 0 0 1 6 6 v8" fill="none" stroke="#16192A" stroke-width="2.4"/>
    <line x1="-24" y1="10" x2="24" y2="10" stroke="#16192A" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="392" y="60" width="290" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="418" cy="86" r="12" fill="#E5F7F1"/>
    <path d="M412 86l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="437" y="82" font-size="12.5" font-weight="700" fill="#16192A">Member of two chambers, not one</text>
    <text x="437" y="99" font-size="11" fill="#8A8371">League City Regional + Bay Area Houston listings</text>
  </g>
  <g>
    <rect x="392" y="126" width="290" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="418" cy="152" r="12" fill="#FDF3E2"/>
    <path d="M413 152a5 5 0 1 1 10 0a5 5 0 1 1 -10 0" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M418 147v10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="437" y="148" font-size="12.5" font-weight="700" fill="#16192A">One name cleared the bar, honestly</text>
    <text x="437" y="165" font-size="11" fill="#8A8371">Six other "League City" candidates traced elsewhere</text>
  </g>

  <text x="60" y="440" font-size="17" font-weight="700" fill="#16192A">Top Marketing Agency in League City, TX</text>
</svg>
