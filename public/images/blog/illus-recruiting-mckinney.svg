<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- McKinney, TX: fast-growth Collin County suburb, new-construction skyline with a tower crane and rising growth line -->
  <path d="M60 366 Q210 348 340 364 T620 358 L620 392 L60 392 Z" fill="#E5F7F1"/>
  <line x1="90" y1="380" x2="232" y2="380" stroke="#0EA5A0" stroke-width="2" opacity="0.4" stroke-dasharray="6 6"/>

  <!-- mid-rise buildings under construction, some with scaffolding grids -->
  <g stroke="#0EA5A0" stroke-width="2.5" fill="none" opacity="0.5">
    <rect x="392" y="316" width="46" height="64"/>
    <line x1="392" y1="332" x2="438" y2="332"/>
    <line x1="392" y1="348" x2="438" y2="348"/>
    <line x1="392" y1="364" x2="438" y2="364"/>
    <line x1="410" y1="316" x2="410" y2="380"/>
    <line x1="424" y1="316" x2="424" y2="380"/>
  </g>
  <g stroke="#0EA5A0" stroke-width="2.5" fill="none" opacity="0.5">
    <rect x="448" y="338" width="34" height="42"/>
    <rect x="490" y="352" width="28" height="28"/>
  </g>

  <!-- tower crane beside the tallest building -->
  <g stroke="#F5A623" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round">
    <line x1="356" y1="380" x2="356" y2="286"/>
    <line x1="356" y1="290" x2="404" y2="290"/>
    <line x1="356" y1="290" x2="330" y2="298"/>
    <line x1="356" y1="298" x2="380" y2="290"/>
    <line x1="396" y1="290" x2="396" y2="310"/>
  </g>
  <circle cx="356" cy="286" r="3" fill="#F5A623"/>

  <!-- small rooftop marks on a couple of finished buildings -->
  <g stroke="#0EA5A0" stroke-width="2.5" fill="none" opacity="0.5">
    <rect x="532" y="358" width="42" height="22"/>
    <rect x="574" y="366" width="16" height="14"/>
  </g>
  <g fill="#0EA5A0" opacity="0.55">
    <circle cx="544" cy="380" r="4"/>
    <circle cx="580" cy="380" r="4"/>
  </g>

  <!-- ascending growth arrow, McKinney's fastest-growing-city angle -->
  <g fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M92 372 L140 348 L176 362 L226 320"/>
    <path d="M226 320 L208 320 M226 320 L226 338"/>
  </g>

  <!-- growth badge -->
  <g>
    <circle cx="270" cy="300" r="34" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <circle cx="270" cy="300" r="34" fill="none" stroke="#F5A623" stroke-width="2" opacity="0.7"/>
    <path d="M254 310 L262 296 L270 304 L286 284" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M278 284 L286 284 L286 292" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- people / hiring card: three head-and-shoulder marks -->
  <g>
    <rect x="110" y="150" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="126" cy="163" r="9" fill="#0EA5A0"/>
    <text x="126" y="167" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="144" y="157" width="140" height="10" rx="5" fill="#F1EDE3"/>
  </g>
  <g fill="#0EA5A0" opacity="0.85">
    <circle cx="140" cy="215" r="7"/><path d="M128 238 Q140 224 152 238 Z"/>
    <circle cx="170" cy="215" r="7"/><path d="M158 238 Q170 224 182 238 Z"/>
    <circle cx="200" cy="215" r="7"/><path d="M188 238 Q200 224 212 238 Z"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="180" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="206" r="12" fill="#E5F7F1"/>
    <path d="M460 206l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="202" font-size="12.5" font-weight="700" fill="#16192A">Hand-checked, not scraped</text>
    <text x="485" y="219" font-size="11" fill="#8A8371">real McKinney offices verified</text>
  </g>
  <g>
    <rect x="440" y="242" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="268" r="12" fill="#FDF3E2"/>
    <path d="M466 261v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="264" font-size="12.5" font-weight="700" fill="#16192A">McKinney, Texas</text>
    <text x="485" y="281" font-size="11" fill="#8A8371">Collin County's fast-growth suburb</text>
  </g>

  <text x="70" y="425" font-size="17" font-weight="700" fill="#16192A">Top Recruiting Companies in McKinney, TX</text>
</svg>
