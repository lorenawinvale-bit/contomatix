    <rect x="420" y="170" width="300" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="448" cy="198" r="12" fill="#E5F7F1"/>
    <path d="M442 198l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="193" font-size="12.5" font-weight="700" fill="#16192A">8 agencies, address-verified</text>
    <text x="468" y="211" font-size="11" fill="#8A8371">Companies House + 2 more sources each</text>
  </g>
  <g>
    <rect x="420" y="238" width="300" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="448" cy="266" r="12" fill="#FDF3E2"/>
    <path d="M448 259v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
