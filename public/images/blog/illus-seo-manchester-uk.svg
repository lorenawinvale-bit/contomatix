    <path d="M -10.5 10 A 10.5 5 0 0 0 10.5 10" fill="none" stroke="#16192A" stroke-width="3.4"/>
    <path d="M -9 18 A 9 5 0 0 0 9 18" fill="none" stroke="#16192A" stroke-width="3.4"/>
