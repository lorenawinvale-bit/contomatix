  <!-- Manchester worker bee, the city's official civic emblem -->
  <g transform="translate(300,340) scale(1.05)">
    <ellipse cx="0" cy="8" rx="7" ry="20" fill="rgba(23,20,44,0.12)" transform="translate(4,26) rotate(10)"/>
    <ellipse cx="-12" cy="-6" rx="16" ry="11" fill="#FDFAF5" stroke="#16192A" stroke-width="1.6" transform="rotate(-18 -12 -6)"/>
    <ellipse cx="12" cy="-6" rx="16" ry="11" fill="#FDFAF5" stroke="#16192A" stroke-width="1.6" transform="rotate(18 12 -6)"/>
