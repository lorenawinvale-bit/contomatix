    <rect x="150" y="182" width="14" height="20" />
    <rect x="176" y="318" width="30" height="94" />
    <rect x="210" y="290" width="34" height="122" />
    <rect x="248" y="336" width="24" height="76" />
  </g>
  <g fill="#0EA5A0" opacity="0.85">
    <rect x="46" y="342" width="8" height="10"/>
    <rect x="60" y="342" width="8" height="10"/>
    <rect x="46" y="362" width="8" height="10"/>
    <rect x="60" y="362" width="8" height="10"/>
    <rect x="84" y="314" width="8" height="10"/>
    <rect x="96" y="314" width="8" height="10"/>
    <rect x="84" y="334" width="8" height="10"/>
    <rect x="96" y="334" width="8" height="10"/>
    <rect x="152" y="214" width="6" height="9"/>
