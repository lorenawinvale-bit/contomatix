    <path d="M -3 -15 q -2 -6 -6 -7" stroke="#16192A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 3 -15 q 2 -6 6 -7" stroke="#16192A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="-9" cy="-22" r="1.6" fill="#F5A623"/>
    <circle cx="9" cy="-22" r="1.6" fill="#F5A623"/>
