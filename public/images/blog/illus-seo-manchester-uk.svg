    <rect x="152" y="250" width="6" height="9"/>
    <rect x="182" y="332" width="8" height="10"/>
    <rect x="194" y="332" width="8" height="10"/>
    <rect x="216" y="304" width="8" height="10"/>
    <rect x="230" y="304" width="8" height="10"/>
    <rect x="216" y="324" width="8" height="10"/>
    <rect x="230" y="324" width="8" height="10"/>
