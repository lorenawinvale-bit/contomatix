    <line x1="300" y1="292" x2="390" y2="292"/>
    <line x1="300" y1="308" x2="390" y2="308"/>
  </g>

  <!-- info cards -->
  <g>
    <rect x="440" y="150" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
