  <ellipse cx="255" cy="410" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- The Woodlands recruiting motif: pine treeline framing a master-planned waterway trail, with a handshake at the center standing in for verified local hiring -->
  <g>
    <!-- treeline -->
    <path d="M35 392 l15 -34 15 34 z" fill="#0EA5A0" opacity="0.5"/>
    <path d="M50 392 l15 -46 15 46 z" fill="#0B807C" opacity="0.5"/>
    <path d="M65 392 l13 -30 13 30 z" fill="#0EA5A0" opacity="0.38"/>
    <path d="M375 392 l15 -40 15 40 z" fill="#0EA5A0" opacity="0.46"/>
    <path d="M390 392 l13 -50 13 50 z" fill="#0B807C" opacity="0.5"/>
    <path d="M403 392 l15 -32 15 32 z" fill="#0EA5A0" opacity="0.38"/>
  </g>

  <!-- office building nodding to Hughes Landing / Grogans Mill Road districts -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="52" height="186" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="9" y="16" width="12" height="14" fill="#FDF3E2"/>
    <rect x="31" y="16" width="12" height="14" fill="#E5F7F1"/>
    <rect x="9" y="40" width="12" height="14" fill="#E5F7F1"/>
    <rect x="31" y="40" width="12" height="14" fill="#FDF3E2"/>
    <rect x="9" y="64" width="12" height="14" fill="#FDF3E2"/>
    <rect x="31" y="64" width="12" height="14" fill="#E5F7F1"/>
    <rect x="9" y="88" width="12" height="14" fill="#E5F7F1"/>
    <rect x="31" y="88" width="12" height="14" fill="#FDF3E2"/>
    <rect x="9" y="112" width="12" height="14" fill="#FDF3E2"/>
    <rect x="31" y="112" width="12" height="14" fill="#E5F7F1"/>
    <rect x="19" y="-11" width="10" height="13" fill="#C9BBA9"/>
  </g>

  <!-- winding waterway/trail motif (master-planned community) -->
  <path d="M45 392 C 125 372, 165 404, 245 392 S 375 372, 465 392" fill="none" stroke="#F5A623" stroke-width="3" opacity="0.32" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- handshake, centered forward as the recruiting/verification motif -->
  <g transform="translate(232,250)">
    <!-- left sleeve -->
    <path d="M0 46 L34 22 L48 30 L46 44 L20 62 Z" fill="#0EA5A0"/>
    <!-- right sleeve -->
    <path d="M120 46 L86 22 L72 30 L74 44 L100 62 Z" fill="#F5A623"/>
    <!-- clasped hands -->
    <path d="M40 34 L52 26 C 58 22 66 22 70 27 L80 34 C 84 38 82 45 76 46 L66 40 C 63 38 59 38 56 40 L48 46 C 43 49 37 46 38 40 Z" fill="#FFE7C2"/>
    <path d="M46 30 L58 24 C 63 21 69 22 72 26" fill="none" stroke="#C97F1E" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <path d="M52 44 L44 39" fill="none" stroke="#C97F1E" stroke-width="1.6" stroke-linecap="round" opacity="0.4"/>
    <circle cx="60" cy="32" r="4.5" fill="#FFFFFF" stroke="#F5A623" stroke-width="2"/>
  </g>

  <g fill="#F5A623" opacity="0.8">
    <circle cx="358" cy="238" r="4"/>
    <circle cx="372" cy="268" r="5"/>
    <circle cx="352" cy="306" r="4"/>
  </g>
  <g stroke="#14B8A6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M270 220 Q290 210 305 196"/>
    <path d="M300 320 Q322 328 340 324"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="160" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="186" r="12" fill="#E5F7F1"/>
    <path d="M460 186l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="182" font-size="12.5" font-weight="700" fill="#16192A">4 of 21 reviewed, verified</text>
    <text x="485" y="199" font-size="11" fill="#8A8371">real Woodlands offices only</text>
  </g>
  <g>
    <rect x="440" y="222" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="248" r="12" fill="#FDF3E2"/>
    <path d="M466 241v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="244" font-size="12.5" font-weight="700" fill="#16192A">Hughes Landing to Grogan's Mill</text>
    <text x="485" y="261" font-size="11" fill="#8A8371">no virtual-address shortcuts</text>
  </g>

  <text x="55" y="428" font-size="16" font-weight="700" fill="#16192A">Top 4 Recruiting Companies in The Woodlands, TX</text>
