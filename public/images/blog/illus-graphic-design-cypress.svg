<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="255" cy="412" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Cypress, TX motif: a pair of literal bald cypress trees (the city's namesake) framing a Cy-Fair small-business storefront, paired with fanned design swatches and a drafting pencil for the graphic-design theme -->
  <g>
    <!-- ground line -->
    <line x1="40" y1="392" x2="330" y2="392" stroke="#EAE0D2" stroke-width="3"/>

    <!-- left bald cypress tree: tall conical layered canopy on a tapered "buttressed" trunk -->
    <g transform="translate(66,190)">
      <path d="M22 202 C14 202 12 194 16 190 L14 176 C10 176 9 168 13 165 L12 150 C9 150 8 142 12 139 L14 60 L30 60 L32 139 C36 142 35 150 32 150 L31 165 C35 168 34 176 30 176 L28 190 C32 194 30 202 22 202 Z" fill="#8A6A4B"/>
      <path d="M23 0 L46 46 L0 46 Z" fill="#0EA5A0" opacity="0.55"/>
      <path d="M23 26 L52 82 L-6 82 Z" fill="#0B807C" opacity="0.55"/>
      <path d="M23 58 L58 118 L-12 118 Z" fill="#0EA5A0" opacity="0.5"/>
      <path d="M23 94 L64 156 L-18 156 Z" fill="#0B807C" opacity="0.48"/>
    </g>

    <!-- right bald cypress tree, smaller -->
    <g transform="translate(300,222)">
      <path d="M18 170 C11 170 10 163 13 160 L12 148 C9 148 8 141 11 139 L10 60 L24 60 L26 139 C29 141 28 148 25 148 L24 160 C27 163 25 170 18 170 Z" fill="#8A6A4B"/>
      <path d="M18 0 L37 38 L-1 38 Z" fill="#0EA5A0" opacity="0.5"/>
      <path d="M18 22 L42 68 L-6 68 Z" fill="#0B807C" opacity="0.5"/>
      <path d="M18 48 L47 98 L-11 98 Z" fill="#0EA5A0" opacity="0.46"/>
      <path d="M18 78 L52 130 L-16 130 Z" fill="#0B807C" opacity="0.44"/>
    </g>

    <!-- small storefront between the trees, standing in for a Cy-Fair small business -->
    <rect x="150" y="300" width="90" height="92" fill="#FFFFFF" stroke="#16192A" stroke-width="1.5"/>
    <polygon points="144,300 246,300 195,272" fill="#0EA5A0"/>
    <rect x="180" y="352" width="30" height="40" fill="#FDF3E2" stroke="#F5A623" stroke-width="1.5"/>
    <rect x="160" y="314" width="20" height="22" fill="none" stroke="#16192A" stroke-width="1" opacity="0.4"/>
    <rect x="210" y="314" width="20" height="22" fill="none" stroke="#16192A" stroke-width="1" opacity="0.4"/>
    <!-- small marquee, echo of a design-shop sign -->
    <rect x="178" y="288" width="34" height="12" rx="3" fill="#E5F7F1" stroke="#0B807C" stroke-width="1.2"/>
  </g>

  <!-- fanned swatch cards + pencil, design-industry motif -->
  <g transform="translate(255,192)">
    <g transform="translate(28,58) rotate(-16)">
      <rect x="0" y="0" width="62" height="88" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="10" width="44" height="30" rx="4" fill="#F5A623"/>
    </g>
    <g transform="translate(56,46) rotate(-4)">
      <rect x="0" y="0" width="62" height="88" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="10" width="44" height="30" rx="4" fill="#0EA5A0"/>
    </g>
    <g transform="translate(84,44) rotate(9)">
      <rect x="0" y="0" width="62" height="88" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="10" width="44" height="30" rx="4" fill="#14B8A6"/>
    </g>

    <!-- pencil crossing the swatches -->
    <g transform="translate(18,4) rotate(34)">
      <rect x="0" y="0" width="128" height="14" rx="3" fill="#F5A623"/>
      <rect x="0" y="0" width="128" height="4" rx="2" fill="#FBC96B"/>
      <rect x="128" y="0" width="16" height="14" fill="#EAE0D2"/>
      <path d="M144 0 L160 7 L144 14 Z" fill="#3A2E22"/>
      <path d="M154 5.5 L160 7 L154 8.5 Z" fill="#16192A"/>
    </g>
  </g>

  <!-- ranked list card, honest count of 2 -->
  <g>
    <rect x="150" y="150" width="176" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="166" cy="163" r="9" fill="#0EA5A0"/>
    <text x="166" y="167" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="184" y="157" width="126" height="10" rx="5" fill="#F1EDE3"/>
  </g>
  <g>
    <rect x="150" y="184" width="176" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="166" cy="197" r="9" fill="#F5A623"/>
    <text x="166" y="201" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <rect x="184" y="191" width="106" height="10" rx="5" fill="#F1EDE3"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="440" y="180" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="206" r="12" fill="#E5F7F1"/>
    <path d="M460 206l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="202" font-size="12.5" font-weight="700" fill="#16192A">2 of 20+ candidates verified</text>
    <text x="485" y="219" font-size="11" fill="#8A8371">real Cypress, TX offices only</text>
  </g>
  <g>
    <rect x="440" y="242" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="268" r="12" fill="#FDF3E2"/>
    <path d="M466 261v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="264" font-size="12.5" font-weight="700" fill="#16192A">Family-run since 1972</text>
    <text x="485" y="281" font-size="11" fill="#8A8371">Cy-Fair's oldest verified design shop</text>
  </g>

  <text x="60" y="435" font-size="17" font-weight="700" fill="#16192A">Top 2 Graphic Design Companies in Cypress, TX</text>
</svg>
