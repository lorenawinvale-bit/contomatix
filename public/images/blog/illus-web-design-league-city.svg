<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="645" cy="75" r="145" fill="rgba(20,184,166,0.06)"/>
  <circle cx="95" cy="410" r="135" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- low waterfront rooftop strip along the base, a bay/sailboat motif distinct from the sister inland-suburb posts, nodding to League City's Clear Lake / Galveston Bay location -->
  <g opacity="0.85">
    <line x1="36" y1="396" x2="300" y2="396" stroke="#EAE0D2" stroke-width="3"/>
    <rect x="44" y="366" width="30" height="30" fill="#F1EDE3"/>
    <rect x="80" y="350" width="34" height="46" fill="#E5F7F1"/>
    <rect x="120" y="372" width="26" height="24" fill="#F1EDE3"/>
    <rect x="152" y="358" width="36" height="38" fill="#FDF3E2"/>
    <rect x="194" y="368" width="28" height="28" fill="#F1EDE3"/>
    <rect x="228" y="352" width="32" height="44" fill="#E5F7F1"/>
    <!-- stylized sailboats on the water, a nod to League City's bay/lake shoreline -->
    <g transform="translate(24,384)">
      <path d="M0 12 L44 12 L38 18 L6 18 Z" fill="#0B807C" opacity="0.55"/>
      <line x1="20" y1="12" x2="20" y2="-6" stroke="#8A8371" stroke-width="1.4"/>
      <path d="M20 -6 L20 10 L34 10 Z" fill="#0EA5A0" opacity="0.65"/>
    </g>
    <g transform="translate(258,388)">
      <path d="M0 10 L38 10 L33 15 L5 15 Z" fill="#0B807C" opacity="0.55"/>
      <line x1="16" y1="10" x2="16" y2="-8" stroke="#8A8371" stroke-width="1.4"/>
      <path d="M16 -8 L16 8 L29 8 Z" fill="#0EA5A0" opacity="0.65"/>
    </g>
  </g>

  <ellipse cx="450" cy="420" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- web design motif: a browser window with a wireframed small-business homepage, paired with a responsive tablet + phone trio -->
  <g>
    <rect x="330" y="150" width="250" height="176" rx="10" fill="#16192A"/>
    <rect x="342" y="176" width="226" height="138" rx="4" fill="#FDFAF5"/>
    <circle cx="346" cy="163" r="3" fill="#EF4444"/>
    <circle cx="356" cy="163" r="3" fill="#F5A623"/>
    <circle cx="366" cy="163" r="3" fill="#0EA5A0"/>
    <rect x="380" y="158" width="150" height="10" rx="5" fill="#232A44"/>

    <!-- wireframe hero block -->
    <rect x="352" y="184" width="206" height="46" rx="4" fill="#E5F7F1"/>
    <rect x="360" y="194" width="90" height="8" rx="4" fill="#0B807C" opacity="0.8"/>
    <rect x="360" y="208" width="60" height="8" rx="4" fill="#0EA5A0" opacity="0.5"/>
    <rect x="486" y="192" width="60" height="18" rx="4" fill="#F5A623"/>

    <!-- wireframe content cards, three-across, standing in for a small local-business site -->
    <rect x="352" y="238" width="62" height="60" rx="4" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1.4"/>
    <rect x="360" y="246" width="46" height="24" rx="3" fill="#FDF3E2"/>
    <rect x="360" y="276" width="46" height="6" rx="3" fill="#EAE0D2"/>
    <rect x="360" y="286" width="30" height="6" rx="3" fill="#EAE0D2"/>

    <rect x="422" y="238" width="62" height="60" rx="4" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1.4"/>
    <rect x="430" y="246" width="46" height="24" rx="3" fill="#E5F7F1"/>
    <rect x="430" y="276" width="46" height="6" rx="3" fill="#EAE0D2"/>
    <rect x="430" y="286" width="30" height="6" rx="3" fill="#EAE0D2"/>

    <rect x="492" y="238" width="62" height="60" rx="4" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1.4"/>
    <rect x="500" y="246" width="46" height="24" rx="3" fill="#FDE7E7"/>
    <rect x="500" y="276" width="46" height="6" rx="3" fill="#EAE0D2"/>
    <rect x="500" y="286" width="30" height="6" rx="3" fill="#EAE0D2"/>

    <!-- cursor click, "building the site" cue -->
    <g transform="translate(474,270)">
      <path d="M0 0 L0 20 L5 15.5 L8.5 22.5 L11.5 21 L8 14 L14 14 Z" fill="#16192A"/>
    </g>
  </g>

  <!-- code bracket + responsive device pair, tucked left of the browser -->
  <g transform="translate(30,180)">
    <text x="0" y="70" font-size="46" font-weight="800" fill="#0EA5A0" opacity="0.85">&lt;/&gt;</text>
  </g>
  <g transform="translate(52,240)">
    <!-- tablet -->
    <rect x="0" y="20" width="70" height="94" rx="8" fill="#FFFFFF" stroke="#16192A" stroke-width="1.6"/>
    <rect x="7" y="30" width="56" height="72" rx="2" fill="#E5F7F1"/>
    <rect x="12" y="36" width="30" height="6" rx="3" fill="#0B807C" opacity="0.7"/>
    <rect x="12" y="48" width="46" height="5" rx="2.5" fill="#EAE0D2"/>
    <rect x="12" y="58" width="46" height="5" rx="2.5" fill="#EAE0D2"/>
    <circle cx="35" cy="108" r="2.4" fill="#8A8371"/>
    <!-- phone overlapping -->
    <rect x="46" y="66" width="34" height="60" rx="7" fill="#FFFFFF" stroke="#16192A" stroke-width="1.6"/>
    <rect x="50" y="73" width="26" height="42" rx="2" fill="#FDF3E2"/>
    <rect x="54" y="79" width="18" height="5" rx="2.5" fill="#F5A623" opacity="0.85"/>
    <rect x="54" y="89" width="18" height="4" rx="2" fill="#EAE0D2"/>
    <circle cx="63" cy="120" r="2" fill="#8A8371"/>
  </g>

  <!-- single verified-pick card, honest "Top 1" for this post (not a ranked list of several) -->
  <g>
    <rect x="70" y="80" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="94" cy="103" r="13" fill="#0EA5A0"/>
    <text x="94" y="108" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="118" y="91" width="130" height="9" rx="4.5" fill="#F1EDE3"/>
    <rect x="118" y="106" width="90" height="7" rx="3.5" fill="#EAE0D2"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="330" y="342" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="356" cy="368" r="12" fill="#E5F7F1"/>
    <path d="M350 368l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="375" y="364" font-size="12.5" font-weight="700" fill="#16192A">1 verified pick, market checked twice</text>
    <text x="375" y="381" font-size="11" fill="#8A8371">real League City address only</text>
  </g>
  <g>
    <rect x="480" y="70" width="252" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="506" cy="96" r="12" fill="#FDF3E2"/>
    <path d="M501 96a5 5 0 1 1 10 0a5 5 0 1 1 -10 0" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M506 91v10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="525" y="92" font-size="12.5" font-weight="700" fill="#16192A">BBB: zero local results</text>
    <text x="525" y="109" font-size="11" fill="#8A8371">most candidates failed on address</text>
  </g>

  <text x="60" y="435" font-size="17" font-weight="700" fill="#16192A">Top Web Design Company in League City, TX</text>
</svg>
