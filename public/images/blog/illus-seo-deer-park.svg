<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- Houston Ship Channel water band -->
  <rect x="0" y="360" width="760" height="115" fill="#E5F7F1"/>
  <path d="M0 360 C 90 348, 180 372, 270 360 C 360 348, 450 372, 540 360 C 630 348, 700 366, 760 358 L 760 475 L 0 475 Z" fill="#CFEFE8"/>
  <g stroke="#0EA5A0" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M20 400 q20 -8 40 0 q20 8 40 0"/>
    <path d="M140 415 q20 -8 40 0 q20 8 40 0"/>
    <path d="M40 435 q20 -8 40 0 q20 8 40 0"/>
    <path d="M170 445 q20 -8 40 0 q20 8 40 0"/>
  </g>

  <!-- distant refinery / petrochemical-plant silhouette, a nod to the Houston Ship Channel industrial corridor, kept soft -->
  <g opacity="0.85">
    <rect x="300" y="320" width="9" height="50" fill="#16192A" opacity="0.14"/>
    <rect x="314" y="270" width="13" height="100" fill="#16192A" opacity="0.14"/>
    <rect x="332" y="240" width="16" height="130" rx="2" fill="#16192A" opacity="0.15"/>
    <rect x="353" y="285" width="10" height="85" fill="#16192A" opacity="0.13"/>
    <rect x="368" y="255" width="14" height="115" fill="#16192A" opacity="0.14"/>
    <rect x="387" y="300" width="9" height="70" fill="#16192A" opacity="0.12"/>
    <!-- storage tanks -->
    <ellipse cx="405" cy="368" rx="16" ry="5" fill="#16192A" opacity="0.12"/>
    <rect x="389" y="345" width="32" height="23" rx="2" fill="#16192A" opacity="0.12"/>
    <ellipse cx="430" cy="370" rx="13" ry="4" fill="#16192A" opacity="0.11"/>
    <rect x="417" y="352" width="26" height="18" rx="2" fill="#16192A" opacity="0.11"/>
    <!-- flare stack with flame -->
    <line x1="340" y1="240" x2="340" y2="222" stroke="#16192A" stroke-width="2" opacity="0.16"/>
    <circle cx="340" cy="217" r="2.4" fill="#F5A623"/>
    <path d="M340 217 q2 -5 -1 -8 q3 2 4 7 q1 -6 -2 -10 q4 3 3 10" fill="#F5A623" opacity="0.55"/>
  </g>

  <!-- Suburban rooftops silhouette, Deer Park's residential neighborhoods alongside the industrial base -->
  <g opacity="0.9">
    <rect x="150" y="330" width="46" height="40" fill="#16192A" opacity="0.10"/>
    <polygon points="146,330 200,330 173,308" fill="#16192A" opacity="0.12"/>
    <rect x="205" y="340" width="40" height="30" fill="#16192A" opacity="0.10"/>
    <polygon points="201,340 249,340 225,320" fill="#16192A" opacity="0.12"/>
    <rect x="60" y="345" width="42" height="25" fill="#16192A" opacity="0.09"/>
    <polygon points="56,345 106,345 81,326" fill="#16192A" opacity="0.11"/>
  </g>

  <ellipse cx="255" cy="415" rx="185" ry="12" fill="rgba(23,20,44,0.06)"/>

  <!-- Home-office trap motif: a single residential house standing in for a "staffed office", with a magnifier -->
  <g transform="translate(56,150)">
    <rect x="0" y="0" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <!-- simple house shape inside the card -->
    <polygon points="75,18 128,54 22,54" fill="#F1EDE3"/>
    <rect x="34" y="54" width="82" height="50" fill="#F1EDE3"/>
    <rect x="62" y="76" width="26" height="28" fill="#FDF3E2" stroke="#F5A623" stroke-width="1.6"/>
    <rect x="42" y="62" width="16" height="14" rx="1" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="92" y="62" width="16" height="14" rx="1" fill="#FFFFFF" stroke="#EAE0D2"/>
    <text x="75" y="146" font-size="34" font-weight="700" fill="#C9BBA9" text-anchor="middle">?</text>
  </g>

  <g stroke="#C9BBA9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" stroke-dasharray="2,7">
    <path d="M290 240 Q312 234 330 222"/>
    <path d="M296 258 Q320 258 338 253"/>
  </g>

  <!-- floating stat cards -->
  <g>
    <rect x="420" y="150" width="280" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="447" cy="178" r="13" fill="#FDF3E2"/>
    <path d="M441 178h12M447 172v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="468" y="174" font-size="12.5" font-weight="700" fill="#16192A">20+ candidates checked</text>
    <text x="468" y="191" font-size="11" fill="#8A8371">zero staffed local SEO offices found</text>
  </g>
  <g>
    <rect x="420" y="214" width="280" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="447" cy="242" r="13" fill="#E5F7F1"/>
    <path d="M441 242l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="238" font-size="12.5" font-weight="700" fill="#16192A">Harris County, TX</text>
    <text x="468" y="255" font-size="11" fill="#8A8371">on the Houston Ship Channel</text>
  </g>

  <text x="56" y="450" font-size="16" font-weight="700" fill="#16192A">SEO Companies in Deer Park, TX: The Honest Answer</text>
</svg>
