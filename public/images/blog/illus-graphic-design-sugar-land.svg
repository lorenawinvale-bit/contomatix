<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="255" cy="405" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Sugar Land motif: modern corporate office towers along a palm-lined boulevard, paired with fanned design swatches, reflecting a wealthy master-planned suburb rather than a creative-agency hub -->
  <g transform="translate(70,150)">
    <!-- corporate office tower skyline, background layer -->
    <g opacity="0.9">
      <rect x="0" y="46" width="26" height="86" fill="rgba(23,20,44,0.14)"/>
      <rect x="30" y="30" width="30" height="102" fill="rgba(20,184,166,0.16)"/>
      <rect x="64" y="54" width="24" height="78" fill="rgba(23,20,44,0.10)"/>
      <rect x="92" y="20" width="32" height="112" fill="rgba(23,20,44,0.18)"/>
      <rect x="128" y="60" width="22" height="72" fill="rgba(20,184,166,0.12)"/>
      <!-- window grid on tallest tower -->
      <g fill="#FDFAF5">
        <rect x="98" y="28" width="5" height="7"/><rect x="108" y="28" width="5" height="7"/><rect x="118" y="28" width="5" height="7"/>
        <rect x="98" y="42" width="5" height="7"/><rect x="108" y="42" width="5" height="7"/><rect x="118" y="42" width="5" height="7"/>
        <rect x="98" y="56" width="5" height="7"/><rect x="108" y="56" width="5" height="7"/><rect x="118" y="56" width="5" height="7"/>
        <rect x="98" y="70" width="5" height="7"/><rect x="108" y="70" width="5" height="7"/><rect x="118" y="70" width="5" height="7"/>
      </g>
      <g fill="#FDFAF5">
        <rect x="36" y="40" width="6" height="8"/><rect x="48" y="40" width="6" height="8"/>
        <rect x="36" y="56" width="6" height="8"/><rect x="48" y="56" width="6" height="8"/>
        <rect x="36" y="72" width="6" height="8"/><rect x="48" y="72" width="6" height="8"/>
      </g>
      <ellipse cx="76" cy="134" rx="80" ry="5" fill="rgba(23,20,44,0.08)"/>
    </g>

    <!-- palm tree accent, boulevard identity -->
    <g transform="translate(150,52)">
      <rect x="8" y="46" width="5" height="42" fill="#8A7A5C"/>
      <path d="M10 46 Q-14 30 -26 40" stroke="#0EA5A0" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M10 46 Q10 20 -2 8" stroke="#14B8A6" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M10 46 Q10 18 24 8" stroke="#14B8A6" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M10 46 Q34 30 46 42" stroke="#0EA5A0" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M10 46 Q6 24 12 12" stroke="#0B807C" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="10" cy="90" rx="20" ry="4" fill="rgba(23,20,44,0.08)"/>
    </g>

    <!-- fanned swatch cards -->
    <g transform="translate(20,205) rotate(-16)">
      <rect x="0" y="0" width="66" height="94" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="11" width="48" height="32" rx="4" fill="#F5A623"/>
    </g>
    <g transform="translate(50,192) rotate(-4)">
      <rect x="0" y="0" width="66" height="94" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="11" width="48" height="32" rx="4" fill="#0EA5A0"/>
    </g>
    <g transform="translate(80,190) rotate(9)">
      <rect x="0" y="0" width="66" height="94" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="11" width="48" height="32" rx="4" fill="#14B8A6"/>
    </g>
    <g transform="translate(110,200) rotate(21)">
      <rect x="0" y="0" width="66" height="94" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="9" y="11" width="48" height="32" rx="4" fill="#EF6461"/>
    </g>
  </g>

  <g stroke="#14B8A6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300 258 Q322 252 340 240"/>
    <path d="M306 275 Q330 275 348 270"/>
    <path d="M300 292 Q322 302 336 310"/>
  </g>
  <g fill="#F5A623" opacity="0.8">
    <circle cx="358" cy="238" r="4"/>
    <circle cx="372" cy="268" r="5"/>
    <circle cx="352" cy="306" r="4"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="150" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
    <path d="M460 176l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">3 studios, hand-verified</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">real Sugar Land offices only</text>
  </g>
  <g>
    <rect x="440" y="212" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M460 238h12M466 232v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">A corporate suburb, not a design hub</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">20+ candidates screened for this list</text>
  </g>

  <text x="70" y="428" font-size="16.5" font-weight="700" fill="#16192A">Top Graphic Design Companies in Sugar Land</text>
</svg>
