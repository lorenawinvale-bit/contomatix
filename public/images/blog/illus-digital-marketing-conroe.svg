    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M460 238h12M466 232v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">PPC, social &amp; email marketing</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">20+ candidates screened for this list</text>
  </g>

  <text x="60" y="428" font-size="15.5" font-weight="700" fill="#16192A">Top Digital Marketing Agencies in Conroe, TX</text>
