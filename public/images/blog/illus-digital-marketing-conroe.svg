    <!-- desktop dashboard monitor, digital-marketing motif -->
    <g transform="translate(6,4)">
      <rect x="0" y="0" width="112" height="76" rx="6" fill="#16192A"/>
      <rect x="6" y="6" width="100" height="58" rx="2" fill="#0EA5A0"/>
      <rect x="12" y="12" width="40" height="6" rx="2" fill="#FDFAF5" opacity="0.85"/>
      <g fill="#FDFAF5">
