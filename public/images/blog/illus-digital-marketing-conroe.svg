      <g stroke="#0EA5A0" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55">
        <path d="M6 100 Q18 96 30 100 T54 100"/>
        <path d="M100 92 Q112 88 124 92 T148 92"/>
      </g>
      <!-- small dock -->
