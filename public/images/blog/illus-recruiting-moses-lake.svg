<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- Moses Lake dual-economy motif: wheat/crop rows on the left meeting a runway on the right, both fronting the lake itself -->
  <!-- lake band -->
  <g>
    <path d="M0 300 Q 190 280 380 300 T 760 300 L 760 340 Q 570 322 380 340 T 0 340 Z" fill="rgba(14,165,160,0.14)"/>
    <path d="M0 320 Q 190 302 380 320 T 760 320 L 760 350 Q 570 336 380 350 T 0 350 Z" fill="rgba(14,165,160,0.22)"/>
  </g>

  <!-- crop rows, left side -->
  <g transform="translate(0,215)">
    <g fill="#16192A" opacity="0.08">
      <rect x="0" y="60" width="330" height="45"/>
    </g>
    <g stroke="#0B807C" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <line x1="12" y1="70" x2="60" y2="30"/>
      <line x1="42" y1="80" x2="90" y2="34"/>
      <line x1="74" y1="88" x2="122" y2="38"/>
      <line x1="106" y1="94" x2="154" y2="42"/>
      <line x1="138" y1="98" x2="186" y2="46"/>
      <line x1="170" y1="100" x2="218" y2="48"/>
      <line x1="202" y1="100" x2="250" y2="48"/>
      <line x1="234" y1="98" x2="282" y2="46"/>
    </g>
    <g fill="#F5A623" opacity="0.75">
      <circle cx="60" cy="30" r="3.4"/>
      <circle cx="90" cy="34" r="3.4"/>
      <circle cx="122" cy="38" r="3.4"/>
      <circle cx="154" cy="42" r="3.4"/>
      <circle cx="186" cy="46" r="3.4"/>
      <circle cx="218" cy="48" r="3.4"/>
      <circle cx="250" cy="48" r="3.4"/>
    </g>
  </g>

  <!-- runway, right side -->
  <g transform="translate(400,230)">
    <g fill="#16192A" opacity="0.1">
      <path d="M20 100 L 40 20 L 70 20 L 90 100 Z"/>
    </g>
    <g stroke="#FDFAF5" stroke-width="4" opacity="0.7">
      <line x1="55" y1="30" x2="55" y2="42"/>
      <line x1="55" y1="50" x2="55" y2="62"/>
      <line x1="55" y1="70" x2="55" y2="82"/>
      <line x1="55" y1="90" x2="55" y2="98"/>
    </g>
    <!-- small aircraft climbing, nodding to Grant County International Airport / AeroTEC flight testing -->
    <g transform="translate(140,10) rotate(-10)">
      <g stroke="#0EA5A0" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.4">
        <path d="M-100 12 Q-64 17 -42 8"/>
      </g>
      <path d="M-6 -4 L-30 -28 L-21 -28 L3 -4 Z" fill="#16192A" opacity="0.85"/>
      <path d="M-6 4 L-30 28 L-21 28 L3 4 Z" fill="#16192A" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="40" ry="6.8" fill="#16192A" opacity="0.85"/>
      <path d="M33 -3 L44 -15 L44 -9 L37 -1 Z" fill="#16192A" opacity="0.85"/>
      <circle cx="38" cy="0" r="2.4" fill="#F5A623"/>
    </g>
  </g>

  <!-- handshake at the meeting point of the two economies -->
  <g transform="translate(345,300)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(-14,-8)">
      <path d="M0 8 L10 2 L18 6 L28 0" fill="none" stroke="#F5A623" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 8 L6 16 L14 20 L20 16 L28 12" fill="none" stroke="#0EA5A0" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g fill="#F5A623" opacity="0.7">
    <circle cx="292" cy="360" r="4"/>
    <circle cx="470" cy="360" r="4"/>
    <circle cx="380" cy="378" r="4.5"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="60" y="90" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="86" cy="116" r="12" fill="#E5F7F1"/>
    <path d="M80 116l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="112" font-size="12.5" font-weight="700" fill="#16192A">4 agencies, hand-verified</text>
    <text x="105" y="129" font-size="11" fill="#8A8371">real Moses Lake offices only</text>
  </g>
  <g>
    <rect x="430" y="90" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="456" cy="116" r="12" fill="#FDF3E2"/>
    <path d="M450 116h12M456 110v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="475" y="112" font-size="12.5" font-weight="700" fill="#16192A">Farms meet flight-testing</text>
    <text x="475" y="129" font-size="11" fill="#8A8371">$1.19B ag economy, aerospace runway</text>
  </g>

  <text x="45" y="428" font-size="16.5" font-weight="700" fill="#16192A">Top Recruiting Companies in Moses Lake, WA</text>
</svg>
