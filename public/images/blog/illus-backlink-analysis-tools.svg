<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="90" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="90" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- central site node -->
  <g>
    <circle cx="380" cy="230" r="34" fill="#0EA5A0"/>
    <circle cx="380" cy="230" r="34" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M368 230a12 12 0 0 1 12-12m0 24a12 12 0 0 0 12-12" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- three scoring rings labelled DR / DA / TF, diverging -->
  <g stroke-width="2.5" fill="none">
    <circle cx="380" cy="230" r="80" stroke="#0EA5A0" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="380" cy="230" r="102" stroke="#F5A623" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="380" cy="230" r="124" stroke="#9B8ACB" stroke-dasharray="4 5" opacity="0.5"/>
  </g>

  <g>
    <rect x="240" y="120" width="72" height="30" rx="15" fill="#E5F7F1" stroke="#0EA5A0"/>
    <text x="276" y="140" font-size="13" font-weight="700" fill="#0B807C" text-anchor="middle">DR 45</text>
  </g>
  <g>
    <rect x="446" y="150" width="72" height="30" rx="15" fill="#FDF3E2" stroke="#F5A623"/>
    <text x="482" y="170" font-size="13" font-weight="700" fill="#B8720F" text-anchor="middle">DA 38</text>
  </g>
  <g>
    <rect x="430" y="300" width="72" height="30" rx="15" fill="#F0EDFA" stroke="#9B8ACB"/>
    <text x="466" y="320" font-size="13" font-weight="700" fill="#6B5FA8" text-anchor="middle">TF 30</text>
  </g>

  <!-- referring domain dots orbiting -->
  <g fill="#16192A">
    <circle cx="270" cy="300" r="5"/>
    <circle cx="240" cy="250" r="5"/>
    <circle cx="500" cy="230" r="5"/>
    <circle cx="330" cy="340" r="5"/>
  </g>

  <ellipse cx="200" cy="430" rx="150" ry="10" fill="rgba(23,20,44,0.05)"/>

  <!-- floating cards -->
  <g>
    <rect x="40" y="290" width="240" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="66" cy="317" r="12" fill="#E5F7F1"/>
    <path d="M60 317l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="313" font-size="12.5" font-weight="700" fill="#16192A">Referring domains &gt; count</text>
    <text x="86" y="330" font-size="11" fill="#8A8371">50 domains beats 200 low-value links</text>
  </g>
  <g>
    <rect x="40" y="352" width="240" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="66" cy="379" r="12" fill="#FDF3E2"/>
    <path d="M66 372v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="86" y="375" font-size="12.5" font-weight="700" fill="#16192A">No score is "the real one"</text>
    <text x="86" y="392" font-size="11" fill="#8A8371">pick one, track it consistently</text>
  </g>

  <text x="40" y="455" font-size="20" font-weight="700" fill="#16192A">Backlink Analysis Tools</text>
</svg>
