<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="255" cy="410" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- The Woodlands marketing-agency motif: pine treeline behind a Class-A office tower, paired with a megaphone broadcasting a campaign burst, reflecting the master-planned-community + full-service-advertising identity -->
  <g>
    <!-- treeline -->
    <path d="M40 392 l15 -32 15 32 z" fill="#0EA5A0" opacity="0.5"/>
    <path d="M55 392 l15 -44 15 44 z" fill="#0B807C" opacity="0.5"/>
    <path d="M70 392 l13 -28 13 28 z" fill="#0EA5A0" opacity="0.38"/>
    <path d="M340 392 l15 -38 15 38 z" fill="#0EA5A0" opacity="0.46"/>
    <path d="M355 392 l13 -48 13 48 z" fill="#0B807C" opacity="0.5"/>
    <path d="M368 392 l15 -30 15 30 z" fill="#0EA5A0" opacity="0.38"/>
  </g>

  <!-- office tower rising above the treeline -->
  <g transform="translate(150,140)">
    <rect x="0" y="0" width="58" height="196" fill="#FFFFFF" stroke="#EAE0D2"/>
    <rect x="10" y="16" width="12" height="14" fill="#FDF3E2"/>
    <rect x="34" y="16" width="12" height="14" fill="#E5F7F1"/>
    <rect x="10" y="40" width="12" height="14" fill="#E5F7F1"/>
    <rect x="34" y="40" width="12" height="14" fill="#FDF3E2"/>
    <rect x="10" y="64" width="12" height="14" fill="#FDF3E2"/>
    <rect x="34" y="64" width="12" height="14" fill="#E5F7F1"/>
    <rect x="10" y="88" width="12" height="14" fill="#E5F7F1"/>
    <rect x="34" y="88" width="12" height="14" fill="#FDF3E2"/>
    <rect x="10" y="112" width="12" height="14" fill="#FDF3E2"/>
    <rect x="34" y="112" width="12" height="14" fill="#E5F7F1"/>
    <rect x="10" y="136" width="12" height="14" fill="#E5F7F1"/>
    <rect x="34" y="136" width="12" height="14" fill="#FDF3E2"/>
    <rect x="22" y="-12" width="10" height="14" fill="#C9BBA9"/>
  </g>

  <!-- winding pathway motif (master-planned community waterway/trail) -->
  <path d="M50 392 C 130 372, 170 404, 250 392 S 380 372, 470 392" fill="none" stroke="#F5A623" stroke-width="3" opacity="0.32" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- megaphone broadcasting a campaign burst -->
  <g transform="translate(258,205)">
    <g transform="rotate(-8)">
      <path d="M0 46 L48 20 L48 72 L0 58 Z" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <path d="M48 20 L100 4 C 108 1 116 7 116 16 L116 76 C116 85 108 91 100 88 L48 72 Z" fill="#F5A623"/>
      <rect x="-14" y="42" width="16" height="20" rx="4" fill="#0EA5A0"/>
      <path d="M20 66 L14 96" stroke="#C9BBA9" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- campaign burst rays -->
    <g stroke="#14B8A6" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M128 20 L152 6"/>
      <path d="M140 46 L168 46"/>
      <path d="M128 74 L152 90"/>
    </g>
    <g fill="#F5A623" opacity="0.85">
      <circle cx="160" cy="4" r="4"/>
      <circle cx="176" cy="46" r="5"/>
      <circle cx="160" cy="94" r="4"/>
    </g>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="160" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="186" r="12" fill="#E5F7F1"/>
    <path d="M460 186l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="182" font-size="12.5" font-weight="700" fill="#16192A">3 of 24, hand-verified</text>
    <text x="485" y="199" font-size="11" fill="#8A8371">real Woodlands agencies only</text>
  </g>
  <g>
    <rect x="440" y="222" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="248" r="12" fill="#FDF3E2"/>
    <path d="M466 241v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="244" font-size="12.5" font-weight="700" fill="#16192A">Full-service, not just SEO</text>
    <text x="485" y="261" font-size="11" fill="#8A8371">branding, media, campaigns</text>
  </g>

  <text x="70" y="430" font-size="16" font-weight="700" fill="#16192A">Top 3 Marketing Agencies in The Woodlands</text>
</svg>
