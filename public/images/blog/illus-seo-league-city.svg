    <rect x="43.5" y="66" width="25.5" height="18" rx="2" fill="#FDF3E2" stroke="#F5A623" stroke-width="1.6"/>
    <text x="94" y="146" font-size="34" font-weight="700" fill="#C9BBA9" text-anchor="middle">?</text>
