<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Cotswold market-town ground -->
  <path d="M0 366 Q140 344 280 362 T580 356 L760 366 L760 400 L0 400 Z" fill="#E5F7F1"/>

  <!-- Tetbury Market House: Cotswold-stone building raised on stone pillars -->
  <g>
    <rect x="150" y="290" width="150" height="60" fill="#EFE6D6" stroke="#C9BBA9" stroke-width="1.5"/>
    <path d="M150 290 L225 262 L300 290 Z" fill="#DCCFB8" stroke="#C9BBA9" stroke-width="1.5"/>
    <rect x="165" y="305" width="16" height="22" fill="#FFFFFF" stroke="#C9BBA9"/>
    <rect x="195" y="305" width="16" height="22" fill="#FFFFFF" stroke="#C9BBA9"/>
    <rect x="225" y="305" width="16" height="22" fill="#FFFFFF" stroke="#C9BBA9"/>
    <rect x="255" y="305" width="16" height="22" fill="#FFFFFF" stroke="#C9BBA9"/>
    <!-- stone pillars beneath -->
    <g stroke="#C9BBA9" stroke-width="6" opacity="0.8">
      <line x1="165" y1="350" x2="165" y2="376"/>
      <line x1="200" y1="350" x2="200" y2="376"/>
      <line x1="240" y1="350" x2="240" y2="376"/>
      <line x1="280" y1="350" x2="280" y2="376"/>
    </g>
  </g>

  <!-- tall church spire nod to St Mary's -->
  <g>
    <rect x="98" y="270" width="16" height="106" fill="#EFE6D6" stroke="#C9BBA9" stroke-width="1.2"/>
    <path d="M98 270 L106 222 L114 270 Z" fill="#DCCFB8" stroke="#C9BBA9" stroke-width="1.2"/>
  </g>

  <!-- wool trade: sheep motif (Tetbury Woolsack heritage) -->
  <g fill="#FFFFFF" stroke="#C9BBA9" stroke-width="1.5">
    <ellipse cx="480" cy="352" rx="19" ry="13"/>
    <circle cx="463" cy="347" r="7.5" fill="#EFE6D6"/>
    <ellipse cx="520" cy="358" rx="15" ry="10.5"/>
    <circle cx="507" cy="354" r="6" fill="#EFE6D6"/>
  </g>

  <!-- info cards -->
  <g>
    <rect x="440" y="150" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
    <path d="M460 176l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">Hand-checked, not scraped</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">every claimed Tetbury office tested</text>
  </g>
  <g>
    <rect x="440" y="212" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M466 231v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">Tetbury, Gloucestershire</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">a Cotswold-stone wool town, pop. ~6,000</text>
  </g>

  <text x="70" y="425" font-size="17" font-weight="700" fill="#16192A">Top SEO Companies in Tetbury</text>
</svg>
