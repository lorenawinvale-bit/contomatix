<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="215" cy="410" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Wichita aviation motif: quonset-style hangar with a small aircraft climbing out, nodding to Textron Aviation and Spirit AeroSystems -->
  <g transform="translate(45,155)">
    <!-- hangar -->
    <g fill="#16192A" opacity="0.12">
      <rect x="0" y="140" width="230" height="95"/>
      <path d="M0 140 A115 100 0 0 1 230 140 Z"/>
    </g>
    <g fill="#16192A" opacity="0.2">
      <path d="M70 235 L70 170 A45 55 0 0 1 160 170 L160 235 Z"/>
    </g>
    <!-- ribbed hangar seams -->
    <g stroke="#FDFAF5" stroke-width="3" opacity="0.5">
      <line x1="38" y1="88" x2="38" y2="140"/>
      <line x1="80" y1="62" x2="80" y2="140"/>
      <line x1="150" y1="62" x2="150" y2="140"/>
      <line x1="192" y1="88" x2="192" y2="140"/>
    </g>
    <!-- windsock on a pole -->
    <g transform="translate(205,50)">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#C9BBA9" stroke-width="3"/>
      <path d="M0 6 L34 12 L26 20 L34 28 L0 34 Z" fill="#F5A623" opacity="0.85"/>
    </g>
  </g>

  <!-- climbing aircraft with rivet-line fuselage and contrail -->
  <g transform="translate(300,150) rotate(-14)">
    <g stroke="#0EA5A0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.45">
      <path d="M-140 18 Q-90 24 -60 12"/>
      <path d="M-150 34 Q-95 42 -66 30"/>
    </g>
    <path d="M-8 -5 L-42 -40 L-30 -40 L4 -6 Z" fill="#16192A" opacity="0.88"/>
    <path d="M-8 5 L-42 40 L-30 40 L4 6 Z" fill="#16192A" opacity="0.88"/>
    <ellipse cx="0" cy="0" rx="56" ry="9.5" fill="#16192A" opacity="0.88"/>
    <path d="M46 -4 L62 -22 L62 -13 L52 -2 Z" fill="#16192A" opacity="0.88"/>
    <path d="M46 4 L60 4 L60 11 L46 11 Z" fill="#16192A" opacity="0.88"/>
    <g fill="#FDFAF5" opacity="0.75">
      <circle cx="-30" cy="0" r="1.6"/>
      <circle cx="-16" cy="0" r="1.6"/>
      <circle cx="-2" cy="0" r="1.6"/>
      <circle cx="12" cy="0" r="1.6"/>
      <circle cx="26" cy="0" r="1.6"/>
    </g>
    <circle cx="53" cy="0" r="3.2" fill="#F5A623"/>
  </g>

  <g fill="#F5A623" opacity="0.8">
    <circle cx="358" cy="228" r="4"/>
    <circle cx="374" cy="258" r="5"/>
    <circle cx="352" cy="292" r="4"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="150" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
    <path d="M460 176l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">8 agencies, hand-verified</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">real Wichita offices only</text>
  </g>
  <g>
    <rect x="440" y="212" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M460 238h12M466 232v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">Boeing-Spirit deal reshapes hiring</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">Dec 2025 acquisition, still unfolding</text>
  </g>

  <text x="45" y="428" font-size="16.5" font-weight="700" fill="#16192A">Top Recruiting Companies in Wichita, KS</text>
</svg>
