    <rect x="218" y="128" width="94" height="72" rx="6" fill="#F3EEE3"/>
  </g>

  <!-- floating verification cards -->
  <g>
    <rect x="430" y="150" width="280" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="457" cy="177" r="12" fill="#E5F7F1"/>
