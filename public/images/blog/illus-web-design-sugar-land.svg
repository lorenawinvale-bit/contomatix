      <rect x="330" y="92" width="6" height="9"/><rect x="342" y="92" width="6" height="9"/><rect x="354" y="92" width="6" height="9"/><rect x="366" y="92" width="6" height="9"/>
      <rect x="330" y="109" width="6" height="9"/><rect x="342" y="109" width="6" height="9"/><rect x="354" y="109" width="6" height="9"/><rect x="366" y="109" width="6" height="9"/>
