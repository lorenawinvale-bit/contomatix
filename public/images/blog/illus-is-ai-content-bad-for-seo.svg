<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- two independent axes: AI-assisted vs not, edited/expert vs thin -->
  <g>
    <line x1="380" y1="115" x2="380" y2="360" stroke="#D6C5AA" stroke-width="2" stroke-dasharray="2 6"/>
    <line x1="170" y1="237" x2="600" y2="237" stroke="#D6C5AA" stroke-width="2" stroke-dasharray="2 6"/>

    <text x="380" y="102" font-size="11" font-weight="700" fill="#8A8371" text-anchor="middle">AI-ASSISTED</text>
    <text x="380" y="378" font-size="11" font-weight="700" fill="#8A8371" text-anchor="middle">HUMAN-WRITTEN</text>
    <text x="160" y="241" font-size="11" font-weight="700" fill="#8A8371" text-anchor="end">THIN</text>
    <text x="610" y="241" font-size="11" font-weight="700" fill="#8A8371" text-anchor="start">EXPERT &amp; EDITED</text>

    <g>
      <rect x="440" y="145" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2.5"/>
      <circle cx="466" cy="171" r="14" fill="#E5F7F1"/>
      <path d="M459 171l4 4 8-8" stroke="#0B807C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="486" y="168" font-size="12" font-weight="700" fill="#16192A">Ranks fine</text>
      <text x="486" y="183" font-size="10.5" fill="#8A8371">AI draft, real edit</text>
    </g>

    <g>
      <rect x="192" y="145" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#E24B4A" stroke-width="2"/>
      <circle cx="218" cy="171" r="14" fill="#FBE3EC"/>
      <path d="M212 165l12 12M224 165l-12 12" stroke="#9D2B55" stroke-width="2.4" stroke-linecap="round"/>
      <text x="238" y="168" font-size="12" font-weight="700" fill="#16192A">Gets penalized</text>
      <text x="238" y="183" font-size="10.5" fill="#8A8371">AI, scaled, unedited</text>
    </g>

    <g>
      <rect x="440" y="257" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1.5"/>
      <circle cx="466" cy="283" r="14" fill="#E5F7F1"/>
      <path d="M459 283l4 4 8-8" stroke="#0B807C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="486" y="280" font-size="12" font-weight="700" fill="#16192A">Ranks fine</text>
      <text x="486" y="295" font-size="10.5" fill="#8A8371">human, real expertise</text>
    </g>

    <g>
      <rect x="192" y="257" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5"/>
      <circle cx="218" cy="283" r="14" fill="#FBE3EC"/>
      <path d="M212 277l12 12M224 277l-12 12" stroke="#9D2B55" stroke-width="2.4" stroke-linecap="round"/>
      <text x="238" y="280" font-size="12" font-weight="700" fill="#16192A">Gets penalized</text>
      <text x="238" y="295" font-size="10.5" fill="#8A8371">thin, no expertise</text>
    </g>
  </g>

  <text x="90" y="435" font-size="20" font-weight="700" fill="#16192A">Is AI Content Bad for SEO?</text>
</svg>
