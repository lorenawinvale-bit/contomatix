<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- chat bubble with a query -->
  <g>
    <path d="M130 170 h270 a18 18 0 0 1 18 18 v90 a18 18 0 0 1 -18 18 h-190 l-35 30 v-30 h-45 a18 18 0 0 1 -18 -18 v-90 a18 18 0 0 1 18 -18 Z" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2.5"/>
    <rect x="152" y="196" width="220" height="10" rx="5" fill="#F1EDE3"/>
    <rect x="152" y="215" width="180" height="10" rx="5" fill="#F1EDE3"/>
    <rect x="152" y="234" width="140" height="10" rx="5" fill="#F1EDE3"/>
    <text x="152" y="200" font-size="0" fill="none"></text>
  </g>

  <!-- magnifying glass hovering over the bubble looking for the brand -->
  <g transform="translate(300,150)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#0EA5A0" stroke-width="7"/>
    <line x1="24" y1="24" x2="46" y2="46" stroke="#0EA5A0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#F5A623"/>
  </g>

  <!-- two outcome cards: found vs missing -->
  <g>
    <rect x="470" y="150" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2"/>
    <circle cx="500" cy="180" r="13" fill="#E5F7F1"/>
    <path d="M493 180l5 5 10-10" stroke="#0B807C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="522" y="176" font-size="13" font-weight="700" fill="#16192A">You're cited</text>
    <text x="522" y="192" font-size="11" fill="#8A8371">Model names your brand</text>
    <rect x="490" y="205" width="190" height="14" rx="7" fill="#E5F7F1"/>
  </g>
  <g>
    <rect x="470" y="252" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <circle cx="500" cy="282" r="13" fill="#FDEEEA"/>
    <line x1="494" y1="276" x2="506" y2="288" stroke="#D9622B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="506" y1="276" x2="494" y2="288" stroke="#D9622B" stroke-width="2.5" stroke-linecap="round"/>
    <text x="522" y="278" font-size="13" font-weight="700" fill="#16192A">You're missing</text>
    <text x="522" y="294" font-size="11" fill="#8A8371">Competitors get named instead</text>
    <rect x="490" y="307" width="190" height="14" rx="7" fill="#F1EDE3"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="120" y="325" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="146" cy="351" r="12" fill="#E5F7F1"/>
    <path d="M140 351l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="347" font-size="12.5" font-weight="700" fill="#16192A">Test category prompts</text>
    <text x="165" y="364" font-size="11" fill="#8A8371">not just your brand name</text>
  </g>
  <g>
    <rect x="120" y="386" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="146" cy="412" r="12" fill="#FDF3E2"/>
    <path d="M146 405v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="165" y="408" font-size="12.5" font-weight="700" fill="#16192A">Run it 2-3 times</text>
    <text x="165" y="425" font-size="11" fill="#8A8371">AI answers vary run to run</text>
  </g>

  <text x="410" y="458" font-size="18" font-weight="700" fill="#16192A">Are You Showing Up in AI Answers?</text>
</svg>
