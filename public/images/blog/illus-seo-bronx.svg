<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="255" cy="405" rx="205" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Bronx motif: an Art Deco Grand Concourse tower beside an elevated subway viaduct with a passing train -->
  <g transform="translate(40,120)">
    <!-- Art Deco tower -->
    <g>
      <rect x="10" y="90" width="90" height="180" fill="#16192A" opacity="0.10"/>
      <rect x="20" y="60" width="70" height="30" fill="#16192A" opacity="0.10"/>
      <rect x="32" y="35" width="46" height="25" fill="#16192A" opacity="0.10"/>
      <circle cx="55" cy="25" r="10" fill="none" stroke="#F5A623" stroke-width="3"/>
      <circle cx="55" cy="25" r="3.5" fill="#F5A623"/>
      <g stroke="#C9BBA9" stroke-width="2" opacity="0.7">
        <line x1="30" y1="110" x2="30" y2="260"/>
        <line x1="55" y1="110" x2="55" y2="260"/>
        <line x1="80" y1="110" x2="80" y2="260"/>
      </g>
      <g fill="#FFFFFF" stroke="#C9BBA9" stroke-width="1.4">
        <rect x="22" y="120" width="14" height="18" rx="2"/>
        <rect x="48" y="120" width="14" height="18" rx="2"/>
        <rect x="74" y="120" width="14" height="18" rx="2"/>
        <rect x="22" y="160" width="14" height="18" rx="2"/>
        <rect x="48" y="160" width="14" height="18" rx="2"/>
        <rect x="74" y="160" width="14" height="18" rx="2"/>
        <rect x="22" y="200" width="14" height="18" rx="2"/>
        <rect x="48" y="200" width="14" height="18" rx="2"/>
        <rect x="74" y="200" width="14" height="18" rx="2"/>
      </g>
    </g>
    <!-- Elevated viaduct -->
    <g transform="translate(120,0)">
      <path d="M0 270 L0 210 L230 210 L230 270" fill="none" stroke="#0EA5A0" stroke-width="6" stroke-linecap="round"/>
      <line x1="40" y1="210" x2="40" y2="270" stroke="#0EA5A0" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="210" x2="90" y2="270" stroke="#0EA5A0" stroke-width="6" stroke-linecap="round"/>
      <line x1="140" y1="210" x2="140" y2="270" stroke="#0EA5A0" stroke-width="6" stroke-linecap="round"/>
      <line x1="190" y1="210" x2="190" y2="270" stroke="#0EA5A0" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="240" x2="230" y2="240" stroke="#0EA5A0" stroke-width="3" opacity="0.5"/>
      <!-- train -->
      <rect x="20" y="188" width="150" height="26" rx="6" fill="#FFFFFF" stroke="#C9BBA9" stroke-width="2"/>
      <rect x="30" y="194" width="20" height="12" rx="1.5" fill="#E5F7F1"/>
      <rect x="58" y="194" width="20" height="12" rx="1.5" fill="#E5F7F1"/>
      <rect x="86" y="194" width="20" height="12" rx="1.5" fill="#E5F7F1"/>
      <rect x="114" y="194" width="20" height="12" rx="1.5" fill="#E5F7F1"/>
      <rect x="142" y="194" width="20" height="12" rx="1.5" fill="#F5A623" opacity="0.5"/>
      <circle cx="35" cy="216" r="5" fill="#16192A" opacity="0.6"/>
      <circle cx="155" cy="216" r="5" fill="#16192A" opacity="0.6"/>
    </g>
  </g>

  <g stroke="#14B8A6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300 268 Q322 262 340 250"/>
    <path d="M306 285 Q330 285 348 280"/>
    <path d="M300 302 Q322 312 336 320"/>
  </g>
  <g fill="#F5A623" opacity="0.8">
    <circle cx="358" cy="248" r="4"/>
    <circle cx="372" cy="278" r="5"/>
    <circle cx="352" cy="316" r="4"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="150" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#FDF3E2"/>
    <path d="M460 176h12M466 170v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">10 competitor picks re-checked</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">0 with a genuine Bronx office</text>
  </g>
  <g>
    <rect x="440" y="212" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#E5F7F1"/>
    <path d="M460 238l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">Same 3-tier verification standard</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">address, service, live site</text>
  </g>

  <text x="45" y="428" font-size="16" font-weight="700" fill="#16192A">SEO Companies in the Bronx: Zero Verified</text>
</svg>
