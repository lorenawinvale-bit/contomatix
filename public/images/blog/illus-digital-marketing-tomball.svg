<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="650" cy="70" r="150" fill="rgba(20,184,166,0.06)"/>
  <circle cx="90" cy="420" r="140" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- small-town skyline strip along the base, kept simple and distinct from the SEO post's storefront scene -->
  <g opacity="0.9">
    <line x1="40" y1="392" x2="330" y2="392" stroke="#EAE0D2" stroke-width="3"/>
    <rect x="48" y="352" width="34" height="40" fill="#F1EDE3"/>
    <rect x="86" y="330" width="40" height="62" fill="#E5F7F1"/>
    <rect x="130" y="358" width="30" height="34" fill="#F1EDE3"/>
    <rect x="164" y="318" width="46" height="74" fill="#FDF3E2"/>
    <polygon points="164,318 210,318 187,298" fill="#F5A623" opacity="0.75"/>
    <rect x="214" y="346" width="32" height="46" fill="#E5F7F1"/>
    <rect x="250" y="364" width="36" height="28" fill="#F1EDE3"/>
    <rect x="290" y="336" width="30" height="56" fill="#FDF3E2"/>
    <circle cx="34" cy="386" r="8" fill="#0EA5A0" opacity="0.5"/>
    <rect x="32" y="392" width="4" height="7" fill="#8A8371"/>
    <circle cx="322" cy="384" r="8" fill="#0EA5A0" opacity="0.5"/>
    <rect x="320" y="390" width="4" height="8" fill="#8A8371"/>
  </g>

  <ellipse cx="450" cy="418" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- digital marketing dashboard / laptop motif, the "digital" half of the small-town-meets-digital idea -->
  <g>
    <rect x="340" y="238" width="230" height="150" rx="10" fill="#16192A"/>
    <rect x="352" y="250" width="206" height="118" rx="4" fill="#FDFAF5"/>
    <rect x="330" y="388" width="250" height="10" rx="4" fill="#16192A"/>

    <!-- bar chart trending up, representing paid ads / campaign growth -->
    <rect x="366" y="330" width="16" height="26" fill="#EAE0D2"/>
    <rect x="390" y="312" width="16" height="44" fill="#F5A623"/>
    <rect x="414" y="294" width="16" height="62" fill="#0EA5A0"/>
    <rect x="438" y="272" width="16" height="84" fill="#0B807C"/>
    <path d="M366 328 L398 306 L422 288 L454 264" fill="none" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="454" cy="264" r="4" fill="#EF4444"/>

    <!-- little target / ad icon top-right of the screen -->
    <circle cx="520" cy="278" r="18" fill="none" stroke="#0EA5A0" stroke-width="2.2"/>
    <circle cx="520" cy="278" r="11" fill="none" stroke="#0EA5A0" stroke-width="2.2"/>
    <circle cx="520" cy="278" r="4" fill="#F5A623"/>

    <!-- browser-bar dots -->
    <circle cx="364" cy="262" r="3" fill="#EF4444"/>
    <circle cx="374" cy="262" r="3" fill="#F5A623"/>
    <circle cx="384" cy="262" r="3" fill="#0EA5A0"/>
  </g>

  <!-- megaphone, social/share bubbles floating near the laptop for the marketing motif -->
  <g transform="translate(292,260)">
    <path d="M0 18 L28 4 L28 40 L0 26 Z" fill="#F5A623"/>
    <rect x="-10" y="16" width="12" height="14" rx="3" fill="#F5A623"/>
    <path d="M28 6 Q42 22 28 38" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="596" cy="232" r="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <path d="M590 236 L594 226 L602 240 Z" fill="#0EA5A0"/>
  </g>
  <g>
    <circle cx="330" cy="216" r="12" fill="#FFFFFF" stroke="#EAE0D2"/>
    <path d="M325 220 c0 -6 4 -9 8 -9 s7 3 7 8 c0 6 -7 9 -7.5 11 c-0.5 -2 -7.5 -4 -7.5 -10z" fill="#EF4444" opacity="0.85"/>
  </g>

  <!-- ranked list card, echoing the honest count used across the Tomball series -->
  <g>
    <rect x="330" y="150" width="180" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="346" cy="163" r="9" fill="#0EA5A0"/>
    <text x="346" y="167" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="364" y="157" width="130" height="10" rx="5" fill="#F1EDE3"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="72" y="60" width="240" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="98" cy="86" r="12" fill="#E5F7F1"/>
    <path d="M92 86l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="117" y="82" font-size="12.5" font-weight="700" fill="#16192A">3 verified, real agencies</text>
    <text x="117" y="99" font-size="11" fill="#8A8371">addresses cross-checked, not scraped</text>
  </g>
  <g>
    <rect x="480" y="150" width="252" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="506" cy="176" r="12" fill="#FDF3E2"/>
    <path d="M501 176a5 5 0 1 1 10 0a5 5 0 1 1 -10 0" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M506 171v10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="525" y="172" font-size="12.5" font-weight="700" fill="#16192A">Same 3 shops, honest overlap</text>
    <text x="525" y="189" font-size="11" fill="#8A8371">Tomball's market is simply this small</text>
  </g>

  <text x="60" y="435" font-size="17" font-weight="700" fill="#16192A">Top 3 Digital Marketing Agencies in Tomball</text>
</svg>
