  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Dubai skyline silhouette: Burj Khalifa style spire + skyscrapers -->
  <g fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2">
