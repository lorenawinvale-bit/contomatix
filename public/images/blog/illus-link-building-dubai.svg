  </g>
  <circle cx="252" cy="110" r="6" fill="#F5A623"/>
  <line x1="252" y1="120" x2="252" y2="104" stroke="#F5A623" stroke-width="2"/>

  <!-- floating cards -->
  <g>
    <rect x="420" y="180" width="260" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="446" cy="206" r="12" fill="#E5F7F1"/>
    <path d="M440 206l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="465" y="202" font-size="12.5" font-weight="700" fill="#16192A">Hand-verified, not scraped</text>
    <text x="465" y="219" font-size="11" fill="#8A8371">real sites, real teams checked</text>
