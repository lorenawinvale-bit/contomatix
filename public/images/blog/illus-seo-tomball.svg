<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="290" cy="420" rx="160" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Tomball historic Main Street motif: modest small-town storefronts, not a skyline -->
  <g>
    <!-- ground line / sidewalk -->
    <line x1="55" y1="390" x2="330" y2="390" stroke="#EAE0D2" stroke-width="3"/>

    <!-- storefront 1 -->
    <rect x="65" y="300" width="66" height="90" fill="#E5F7F1" stroke="#0EA5A0" stroke-width="1.5" opacity="0.85"/>
    <polygon points="60,300 136,300 98,272" fill="#0B807C" opacity="0.9"/>
    <rect x="88" y="345" width="22" height="45" fill="#FFFFFF" stroke="#0B807C" stroke-width="1.5"/>
    <g stroke="#0EA5A0" stroke-width="1" opacity="0.45">
      <rect x="72" y="312" width="18" height="22" fill="none"/>
      <rect x="106" y="312" width="18" height="22" fill="none"/>
    </g>
    <!-- awning -->
    <path d="M68 312 L128 312 L124 326 L72 326 Z" fill="#F5A623" opacity="0.8"/>

    <!-- storefront 2, taller, centerpiece -->
    <rect x="148" y="262" width="72" height="128" fill="#FFFFFF" stroke="#16192A" stroke-width="1.5"/>
    <polygon points="142,262 226,262 184,232" fill="#0EA5A0"/>
    <rect x="176" y="350" width="24" height="40" fill="#FDF3E2" stroke="#F5A623" stroke-width="1.5"/>
    <g stroke="#16192A" stroke-width="1" opacity="0.4">
      <rect x="158" y="276" width="20" height="24" fill="none"/>
      <rect x="190" y="276" width="20" height="24" fill="none"/>
      <rect x="158" y="312" width="20" height="24" fill="none"/>
      <rect x="190" y="312" width="20" height="24" fill="none"/>
    </g>
    <path d="M150 276 L218 276 L213 292 L155 292 Z" fill="#F5A623" opacity="0.85"/>
    <!-- small clock/sign above centerpiece door, nod to Tomball's historic depot district -->
    <circle cx="184" cy="248" r="11" fill="#FDFAF5" stroke="#16192A" stroke-width="1.8"/>
    <line x1="184" y1="248" x2="184" y2="241" stroke="#16192A" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="184" y1="248" x2="189" y2="248" stroke="#16192A" stroke-width="1.6" stroke-linecap="round"/>

    <!-- storefront 3 -->
    <rect x="234" y="312" width="60" height="78" fill="#FDF3E2" stroke="#F5A623" stroke-width="1.5" opacity="0.85"/>
    <polygon points="229,312 299,312 264,286" fill="#F59E0B" opacity="0.85"/>
    <rect x="252" y="356" width="20" height="34" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.5"/>
    <g stroke="#F5A623" stroke-width="1" opacity="0.45">
      <rect x="240" y="324" width="16" height="20" fill="none"/>
      <rect x="270" y="324" width="16" height="20" fill="none"/>
    </g>

    <!-- lampposts flanking the street, small-town touch -->
    <line x1="55" y1="390" x2="55" y2="345" stroke="#8A8371" stroke-width="2.5"/>
    <circle cx="55" cy="340" r="6" fill="#F5A623" opacity="0.8"/>
    <line x1="312" y1="390" x2="312" y2="345" stroke="#8A8371" stroke-width="2.5"/>
    <circle cx="312" cy="340" r="6" fill="#F5A623" opacity="0.8"/>

    <!-- a couple of trees for the small-town feel -->
    <circle cx="40" cy="380" r="9" fill="#0EA5A0" opacity="0.5"/>
    <rect x="38" y="386" width="4" height="8" fill="#8A8371"/>
    <circle cx="322" cy="378" r="9" fill="#0EA5A0" opacity="0.5"/>
    <rect x="320" y="384" width="4" height="8" fill="#8A8371"/>
  </g>

  <!-- ranked list card, honest count of 2 -->
  <g>
    <rect x="118" y="150" width="180" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="134" cy="163" r="9" fill="#0EA5A0"/>
    <text x="134" y="167" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="152" y="157" width="130" height="10" rx="5" fill="#F1EDE3"/>
  </g>
  <g>
    <rect x="118" y="184" width="180" height="26" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="134" cy="197" r="9" fill="#F5A623"/>
    <text x="134" y="201" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <rect x="152" y="191" width="110" height="10" rx="5" fill="#F1EDE3"/>
  </g>

  <!-- floating info cards -->
  <g>
    <rect x="440" y="180" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="206" r="12" fill="#E5F7F1"/>
    <path d="M460 206l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="202" font-size="12.5" font-weight="700" fill="#16192A">Hand-checked, not scraped</text>
    <text x="485" y="219" font-size="11" fill="#8A8371">real Tomball addresses verified</text>
  </g>
  <g>
    <rect x="440" y="242" width="270" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="268" r="12" fill="#FDF3E2"/>
    <path d="M466 261v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="264" font-size="12.5" font-weight="700" fill="#16192A">2 of 26 candidates verified</text>
    <text x="485" y="281" font-size="11" fill="#8A8371">small Houston exurb, honest count</text>
  </g>

  <text x="60" y="425" font-size="18" font-weight="700" fill="#16192A">Top 2 SEO Companies in Tomball</text>
</svg>
