<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="90" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="90" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- wide shallow tool (many features, thin depth) -->
  <g>
    <rect x="90" y="150" width="260" height="150" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <text x="110" y="178" font-size="12.5" font-weight="700" fill="#16192A">All-in-one platform</text>
    <g fill="#F0EDE6">
      <rect x="110" y="192" width="50" height="34" rx="6"/>
      <rect x="168" y="192" width="50" height="34" rx="6"/>
      <rect x="226" y="192" width="50" height="34" rx="6"/>
      <rect x="284" y="192" width="46" height="34" rx="6"/>
      <rect x="110" y="234" width="50" height="34" rx="6"/>
      <rect x="168" y="234" width="50" height="34" rx="6"/>
      <rect x="226" y="234" width="50" height="34" rx="6"/>
      <rect x="284" y="234" width="46" height="34" rx="6"/>
    </g>
    <text x="110" y="286" font-size="11" fill="#8A8371">250+ tools, thin on each</text>
  </g>

  <!-- narrow deep tool (focused, strong depth) -->
  <g>
    <rect x="410" y="150" width="260" height="150" rx="14" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2"/>
    <text x="430" y="178" font-size="12.5" font-weight="700" fill="#16192A">SEO-focused writer</text>
    <rect x="430" y="192" width="220" height="16" rx="4" fill="#E5F7F1"/>
    <rect x="430" y="216" width="220" height="16" rx="4" fill="#E5F7F1"/>
    <rect x="430" y="240" width="220" height="16" rx="4" fill="#E5F7F1"/>
    <rect x="430" y="264" width="140" height="16" rx="4" fill="#0EA5A0"/>
    <text x="430" y="298" font-size="11" fill="#0B807C" font-weight="700">One job, done deeply</text>
  </g>

  <ellipse cx="200" cy="430" rx="150" ry="10" fill="rgba(23,20,44,0.05)"/>

  <g>
    <rect x="220" y="330" width="320" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="246" cy="357" r="12" fill="#FDF3E2"/>
    <path d="M246 350v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="266" y="353" font-size="12.5" font-weight="700" fill="#16192A">Breadth vs. depth tradeoff</text>
    <text x="266" y="370" font-size="11" fill="#8A8371">match the tool to your actual need</text>
  </g>

  <text x="40" y="455" font-size="20" font-weight="700" fill="#16192A">GravityWrite Alternatives</text>
</svg>
