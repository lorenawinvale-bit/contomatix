    <rect x="0" y="16" width="330" height="14" fill="#F3EEE3"/>
    <circle cx="18" cy="15" r="4.5" fill="#F5A623"/>
    <circle cx="34" cy="15" r="4.5" fill="#14B8A6"/>
    <circle cx="50" cy="15" r="4.5" fill="#C9BBA9"/>
    <rect x="80" y="10" width="200" height="10" rx="5" fill="#FFFFFF" stroke="#EAE0D2"/>
    <!-- page wireframe -->
    <rect x="18" y="44" width="120" height="66" rx="6" fill="#E5F7F1"/>
    <path d="M30 100 L60 70 L80 88 L100 60 L126 100 Z" fill="#0EA5A0" opacity="0.35"/>
    <rect x="148" y="44" width="164" height="10" rx="5" fill="#16192A" opacity="0.75"/>
    <rect x="148" y="60" width="164" height="7" rx="3.5" fill="#C9BBA9" opacity="0.6"/>
    <rect x="148" y="72" width="140" height="7" rx="3.5" fill="#C9BBA9" opacity="0.6"/>
    <rect x="148" y="84" width="150" height="7" rx="3.5" fill="#C9BBA9" opacity="0.6"/>
    <rect x="148" y="98" width="72" height="18" rx="9" fill="#F5A623"/>
    <rect x="18" y="128" width="90" height="72" rx="6" fill="#FDF3E2"/>
    <rect x="118" y="128" width="90" height="72" rx="6" fill="#E5F7F1"/>
    <rect x="218" y="128" width="94" height="72" rx="6" fill="#F3EEE3"/>
