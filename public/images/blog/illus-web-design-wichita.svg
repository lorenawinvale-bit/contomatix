    <text x="477" y="190" font-size="11" fill="#8A8371">real Wichita offices only</text>
  </g>
  <g>
    <rect x="430" y="214" width="280" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="457" cy="241" r="12" fill="#FDF3E2"/>
    <path d="M451 241h12M457 235v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="477" y="237" font-size="12.5" font-weight="700" fill="#16192A">Names &amp; addresses fact-checked</text>
    <text x="477" y="254" font-size="11" fill="#8A8371">rebrands and closures ruled out</text>
