      <rect x="322" y="40" width="62" height="16"/>
      <circle cx="343" cy="30" r="9"/>
      <circle cx="363" cy="30" r="9"/>
    </g>
    <!-- wheat accents -->
    <g stroke="#F5A623" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6">
      <path d="M180 160 L180 128 M180 138 L170 128 M180 138 L190 128 M180 148 L172 140 M180 148 L188 140"/>
      <path d="M204 160 L204 122 M204 132 L194 122 M204 132 L214 122 M204 144 L196 136 M204 144 L212 136 M204 154 L197 148 M204 154 L211 148"/>
