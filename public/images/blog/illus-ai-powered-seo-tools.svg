    <text x="380" y="255" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">DO WELL?</text>
  </g>

  <line x1="331" y1="200" x2="220" y2="150" stroke="#C9BBA9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="331" y1="230" x2="150" y2="230" stroke="#C9BBA9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="331" y1="260" x2="220" y2="322" stroke="#C9BBA9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="429" y1="200" x2="540" y2="150" stroke="#C9BBA9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="429" y1="260" x2="540" y2="322" stroke="#C9BBA9" stroke-width="1.5" stroke-dasharray="3 4"/>

