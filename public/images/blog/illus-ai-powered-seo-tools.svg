    <text x="36" y="235" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="56" y="227" font-size="11.5" font-weight="700" fill="#16192A">Content briefs</text>
    <text x="56" y="242" font-size="10" fill="#8A8371">structure, not full drafts</text>
  </g>

