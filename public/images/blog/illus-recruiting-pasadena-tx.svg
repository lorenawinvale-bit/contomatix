<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="205" cy="412" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Pasadena, TX petrochemical/industrial motif: refinery skyline with stacks, flare, and storage tanks -->
  <g transform="translate(20,150)">
    <g fill="#16192A" opacity="0.14">
      <rect x="0" y="170" width="260" height="70"/>
      <rect x="22" y="120" width="26" height="50"/>
      <rect x="70" y="90" width="20" height="80"/>
      <rect x="112" y="60" width="16" height="110"/>
      <rect x="150" y="105" width="22" height="65"/>
      <rect x="196" y="75" width="18" height="95"/>
    </g>
    <!-- storage tanks -->
    <g fill="#16192A" opacity="0.2">
      <rect x="8" y="150" width="40" height="40" rx="3"/>
      <ellipse cx="28" cy="150" rx="20" ry="6"/>
      <rect x="60" y="155" width="34" height="35" rx="3"/>
      <ellipse cx="77" cy="155" rx="17" ry="5.5"/>
    </g>
    <!-- flare stack with flame -->
    <g>
      <rect x="118" y="40" width="6" height="130" fill="#16192A" opacity="0.22"/>
      <path d="M121 40 Q131 22 121 6 Q113 22 121 40 Z" fill="#F5A623" opacity="0.85"/>
      <path d="M121 30 Q126 20 121 10 Q117 20 121 30 Z" fill="#FDFAF5" opacity="0.5"/>
    </g>
    <!-- window/seam highlights on stacks -->
    <g stroke="#FDFAF5" stroke-width="2" opacity="0.45">
      <line x1="153" y1="112" x2="169" y2="112"/>
      <line x1="153" y1="135" x2="169" y2="135"/>
      <line x1="199" y1="90" x2="211" y2="90"/>
      <line x1="199" y1="115" x2="211" y2="115"/>
    </g>
  </g>

  <!-- hard hat with handshake, front and center -->
  <g transform="translate(300,275)">
    <ellipse cx="0" cy="55" rx="72" ry="12" fill="rgba(23,20,44,0.07)"/>
    <!-- hard hat -->
    <g transform="translate(-38,-70)">
      <path d="M2 26 A38 30 0 0 1 78 26 Z" fill="#F5A623"/>
      <rect x="-6" y="22" width="92" height="10" rx="5" fill="#E0900F"/>
      <rect x="34" y="-10" width="8" height="18" rx="3" fill="#E0900F"/>
    </g>
    <!-- handshake -->
    <g transform="translate(-46,10)">
      <path d="M0 18 L22 4 L34 4 L46 14 L60 4 L74 4 L92 18 L92 30 L78 40 L70 34 L58 42 L46 34 L34 40 L20 32 L8 30 Z" fill="#16192A" opacity="0.85"/>
      <path d="M0 18 L22 4 L34 4 L46 14" fill="none" stroke="#0EA5A0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M92 18 L74 4 L60 4 L46 14" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="#F5A623" opacity="0.8">
    <circle cx="255" cy="235" r="4"/>
    <circle cx="272" cy="262" r="5"/>
    <circle cx="248" cy="298" r="4"/>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="440" y="150" width="280" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="176" r="12" fill="#E5F7F1"/>
    <path d="M460 176l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="172" font-size="12.5" font-weight="700" fill="#16192A">8 agencies, hand-verified</text>
    <text x="485" y="189" font-size="11" fill="#8A8371">real Pasadena, TX offices only</text>
  </g>
  <g>
    <rect x="440" y="212" width="280" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="466" cy="238" r="12" fill="#FDF3E2"/>
    <path d="M460 238h12M466 232v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="485" y="234" font-size="12.5" font-weight="700" fill="#16192A">Ship Channel drives the demand</text>
    <text x="485" y="251" font-size="11" fill="#8A8371">manufacturing + construction staffing</text>
  </g>

  <text x="45" y="432" font-size="16.5" font-weight="700" fill="#16192A">Top Recruiting Companies in Pasadena, TX</text>
</svg>
