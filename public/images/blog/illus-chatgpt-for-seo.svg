<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- prompt input card -->
  <g>
    <rect x="120" y="150" width="260" height="150" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <text x="140" y="176" font-size="10" font-weight="700" fill="#0B807C">PROMPT</text>
    <rect x="140" y="188" width="220" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="204" width="200" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="220" width="210" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="248" width="140" height="24" rx="12" fill="#16192A"/>
    <text x="155" y="264" font-size="10.5" font-weight="700" fill="#5EEAD4">25 prompts inside</text>
  </g>

  <path d="M392 220 h48" stroke="#C9BBA9" stroke-width="2" fill="none"/>
  <polygon points="434,215 446,220 434,225" fill="#C9BBA9"/>

  <!-- chat response bubble -->
  <g>
    <path d="M460 170 h180 a16 16 0 0 1 16 16 v80 a16 16 0 0 1 -16 16 h-120 l-26 22 v-22 h-34 a16 16 0 0 1 -16 -16 v-80 a16 16 0 0 1 16 -16 Z" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2.5"/>
    <rect x="480" y="192" width="140" height="9" rx="4.5" fill="#F1EDE3"/>
    <rect x="480" y="210" width="110" height="9" rx="4.5" fill="#F1EDE3"/>
    <rect x="480" y="234" width="80" height="20" rx="10" fill="#FDF3E2" stroke="#F5A623"/>
    <text x="490" y="248" font-size="9.5" font-weight="700" fill="#B5730E">verify this</text>
  </g>

  <g>
    <rect x="140" y="325" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="166" cy="351" r="12" fill="#E5F7F1"/>
    <path d="M160 351l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="347" font-size="12.5" font-weight="700" fill="#16192A">Copy-paste ready</text>
    <text x="185" y="364" font-size="11" fill="#8A8371">not vague suggestions</text>
  </g>
  <g>
    <rect x="450" y="325" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="476" cy="351" r="12" fill="#FDF3E2"/>
    <path d="M476 344v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="495" y="347" font-size="12.5" font-weight="700" fill="#16192A">Real limits included</text>
    <text x="495" y="364" font-size="11" fill="#8A8371">where it guesses wrong</text>
  </g>

  <text x="140" y="425" font-size="20" font-weight="700" fill="#16192A">ChatGPT for SEO</text>
</svg>
