    <text x="404" y="300" font-size="12.5" font-weight="700" fill="#16192A" text-anchor="end">4</text>
    <line x1="106" y1="312" x2="404" y2="312" stroke="#F1EDE3" stroke-width="1.5"/>
    <text x="106" y="332" font-size="12.5" font-weight="700" fill="#B5730E">Clicks for linked pages</text>
    <text x="404" y="332" font-size="12.5" font-weight="700" fill="#B5730E" text-anchor="end">tracked</text>
