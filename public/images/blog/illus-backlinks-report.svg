  <g>
    <rect x="452" y="178" width="220" height="170" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1.5"/>
    <text x="562" y="210" font-size="12" font-weight="700" fill="#8A8371" text-anchor="middle">SEARCH CONSOLE CAPS</text>
