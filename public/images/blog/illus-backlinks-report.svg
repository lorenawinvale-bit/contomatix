    <text x="562" y="322" font-size="10.5" fill="#8A8371" text-anchor="middle">grouped, deduplicated, sampled</text>
  </g>

  <text x="90" y="400" font-size="22" font-weight="700" fill="#16192A">The Backlinks Report</text>
  <text x="90" y="424" font-size="13" fill="#8A8371">Five rows that change a decision, four that do not</text>
