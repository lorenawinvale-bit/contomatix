    <line x1="121" y1="138" x2="126" y2="143" stroke="#8A8371" stroke-width="2.2" stroke-linecap="round"/>
    <text x="140" y="139" font-size="14" fill="#16192A">backlinks report</text>
  </g>

  <!-- report card -->
  <g>
    <rect x="90" y="178" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2"/>
    <rect x="90" y="178" width="330" height="26" rx="14" fill="#F1EDE3"/>
    <rect x="90" y="196" width="330" height="8" fill="#F1EDE3"/>
    <text x="106" y="196" font-size="11" font-weight="700" fill="#8A8371">MONTHLY REPORT &#183; SEPTEMBER</text>
    <text x="106" y="228" font-size="12.5" fill="#16192A">Referring domains</text>
    <text x="404" y="228" font-size="12.5" font-weight="700" fill="#0B807C" text-anchor="end">+6</text>
    <text x="106" y="252" font-size="12.5" fill="#16192A">New links, named</text>
    <text x="404" y="252" font-size="12.5" font-weight="700" fill="#0B807C" text-anchor="end">9</text>
    <text x="106" y="276" font-size="12.5" fill="#16192A">Lost links, named</text>
    <text x="404" y="276" font-size="12.5" font-weight="700" fill="#C2410C" text-anchor="end">2</text>
