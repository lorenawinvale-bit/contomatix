    <line x1="90" y1="348" x2="580" y2="348"/>
    <line x1="90" y1="364" x2="580" y2="364"/>
  </g>
  <!-- almond tree rows, small canopies on trunks -->
  <g opacity="0.9">
    <line x1="130" y1="332" x2="130" y2="352" stroke="#8A6B4A" stroke-width="3"/>
    <circle cx="130" cy="326" r="12" fill="#F7D8E4"/>
    <line x1="190" y1="332" x2="190" y2="352" stroke="#8A6B4A" stroke-width="3"/>
    <circle cx="190" cy="326" r="12" fill="#F7D8E4"/>
    <line x1="250" y1="332" x2="250" y2="352" stroke="#8A6B4A" stroke-width="3"/>
    <circle cx="250" cy="326" r="12" fill="#F7D8E4"/>
