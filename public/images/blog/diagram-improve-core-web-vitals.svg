<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI',Arial,sans-serif"><rect width="760" height="560" fill="#FAF5EF"/><text x="28" y="48" font-size="21" font-weight="800" fill="#16192A">One wrong image size, fixed</text><circle cx="145.33333333333331" cy="220" r="78" fill="none" stroke="#EAE0D2" stroke-width="16"/><circle cx="145.33333333333331" cy="220" r="78" fill="none" stroke="#E5484D" stroke-width="16"/><text x="145.33333333333331" y="230" font-size="26" font-weight="800" fill="#16192A" text-anchor="middle">0.425</text><text x="145.33333333333331" y="342" font-size="16" fill="#16192A" font-weight="800" text-anchor="middle">PR link building guide</text><text x="145.33333333333331" y="362" font-size="16" fill="#16192A" font-weight="800" text-anchor="middle">before</text><text x="145.33333333333331" y="388" font-size="13" fill="#6b6459" font-weight="400" text-anchor="middle">Hero image declared at the</text><text x="145.33333333333331" y="406" font-size="13" fill="#6b6459" font-weight="400" text-anchor="middle">wrong size</text><circle cx="379.99999999999994" cy="220" r="78" fill="none" stroke="#EAE0D2" stroke-width="16"/><path d="M 379.99999999999994 142 A 78 78 0 1 1 334.2 283.1" fill="none" stroke="#0EA5A0" stroke-width="16" stroke-linecap="round"/><text x="379.99999999999994" y="230" font-size="26" font-weight="800" fill="#16192A" text-anchor="middle">0.060</text><text x="379.99999999999994" y="342" font-size="16" fill="#16192A" font-weight="800" text-anchor="middle">Same page after the fix</text><text x="379.99999999999994" y="388" font-size="13" fill="#6b6459" font-weight="400" text-anchor="middle">Under the 0.1 limit</text><circle cx="614.6666666666666" cy="220" r="78" fill="none" stroke="#EAE0D2" stroke-width="16"/><path d="M 614.6666666666666 142 A 78 78 0 0 1 688.8 195.9" fill="none" stroke="#0EA5A0" stroke-width="16" stroke-linecap="round"/><text x="614.6666666666666" y="230" font-size="26" font-weight="800" fill="#16192A" text-anchor="middle">0.020</text><text x="614.6666666666666" y="342" font-size="16" fill="#16192A" font-weight="800" text-anchor="middle">Worst of the other four</text><text x="614.6666666666666" y="362" font-size="16" fill="#16192A" font-weight="800" text-anchor="middle">posts</text><text x="614.6666666666666" y="388" font-size="13" fill="#6b6459" font-weight="400" text-anchor="middle">After the same fix</text><rect x="28" y="484" width="704" height="42" rx="10" fill="#fff" stroke="#EAE0D2"/><text x="44" y="510" font-size="14" fill="#6b6459" font-weight="400" text-anchor="start">Ring = share of the 0.1 limit used. Measured live in October 2026.</text><defs><linearGradient id="lgr" x1="10" y1="8" x2="38" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2DD4BF"/><stop offset="0.55" stop-color="#0EA5A0"/><stop offset="1" stop-color="#0B807C"/></linearGradient><linearGradient id="lgn" x1="30" y1="9" x2="41" y2="19" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F5A623"/></linearGradient><linearGradient id="lgt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="0.55" stop-color="#0EA5A0"/><stop offset="1" stop-color="#0B807C"/></linearGradient></defs><g transform="translate(600 16)"><g transform="scale(0.8)"><path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="url(#lgr)" stroke-width="6" stroke-linecap="round"/><line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.7"/><line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.7"/><circle cx="35.52" cy="13.63" r="4.2" fill="url(#lgn)"/><circle cx="35.52" cy="13.63" r="1.5" fill="#fff"/><circle cx="35.52" cy="34.37" r="4.2" fill="#14B8A6"/><circle cx="35.52" cy="34.37" r="1.5" fill="#fff"/><circle cx="24" cy="24" r="2.4" fill="#16192A"/></g><text x="44" y="26" font-size="20" font-weight="700" font-family="'Segoe UI',Arial,sans-serif" letter-spacing="-0.3">