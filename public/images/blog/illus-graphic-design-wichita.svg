    <g transform="translate(30,205) rotate(-18)">
      <rect x="0" y="0" width="70" height="100" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="10" y="12" width="50" height="34" rx="4" fill="#F5A623"/>
    </g>
    <g transform="translate(60,190) rotate(-6)">
      <rect x="0" y="0" width="70" height="100" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="10" y="12" width="50" height="34" rx="4" fill="#0EA5A0"/>
    </g>
    <g transform="translate(92,186) rotate(7)">
      <rect x="0" y="0" width="70" height="100" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
      <rect x="10" y="12" width="50" height="34" rx="4" fill="#14B8A6"/>
    </g>
    <g transform="translate(124,196) rotate(19)">
