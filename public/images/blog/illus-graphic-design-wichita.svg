    <g transform="translate(178,60)">
      <path d="M17 90 L17 55 L9 40 L14 40 L17 30 L20 40 L25 40 L17 55 M17 55 L4 62 M17 55 L30 62 M9 40 L2 34 M14 40 L6 30 M20 40 L28 30 M25 40 L32 34" stroke="#16192A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
      <ellipse cx="17" cy="92" rx="16" ry="3.5" fill="rgba(23,20,44,0.08)"/>
