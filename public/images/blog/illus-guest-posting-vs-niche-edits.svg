<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="90" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="90" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- left card: guest post (new article) -->
  <g>
    <rect x="90" y="150" width="240" height="180" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <rect x="112" y="172" width="196" height="10" rx="3" fill="#16192A"/>
    <rect x="112" y="192" width="196" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="112" y="206" width="170" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="112" y="220" width="180" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="112" y="234" width="140" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="112" y="256" width="90" height="22" rx="11" fill="#E5F7F1"/>
    <text x="128" y="271" font-size="11" font-weight="700" fill="#0B807C">New article</text>
    <text x="112" y="305" font-size="13" font-weight="700" fill="#16192A">Guest Post</text>
    <text x="112" y="320" font-size="11" fill="#8A8371">~$459 avg &#8226; slower</text>
  </g>

  <!-- right card: niche edit (existing page + inserted link) -->
  <g>
    <rect x="430" y="150" width="240" height="180" rx="14" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <rect x="452" y="172" width="196" height="10" rx="3" fill="#16192A"/>
    <rect x="452" y="192" width="196" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="452" y="206" width="170" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="452" y="220" width="120" height="6" rx="3" fill="#F5A623"/>
    <rect x="452" y="234" width="140" height="6" rx="3" fill="#C9BBA9"/>
    <rect x="452" y="256" width="110" height="22" rx="11" fill="#FDF3E2"/>
    <text x="466" y="271" font-size="11" font-weight="700" fill="#B8720F">Existing page</text>
    <text x="452" y="305" font-size="13" font-weight="700" fill="#16192A">Niche Edit</text>
    <text x="452" y="320" font-size="11" fill="#8A8371">~$225 avg &#8226; faster</text>
  </g>

  <text x="357" y="245" font-size="16" font-weight="700" fill="#8A8371" text-anchor="middle">vs</text>

  <ellipse cx="200" cy="430" rx="150" ry="10" fill="rgba(23,20,44,0.05)"/>

  <!-- floating card: compliance flag -->
  <g>
    <rect x="220" y="360" width="320" height="54" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="246" cy="387" r="12" fill="#FDF3E2"/>
    <path d="M246 380v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="266" y="383" font-size="12.5" font-weight="700" fill="#16192A">Same policy risk, either way</text>
    <text x="266" y="400" font-size="11" fill="#8A8371">disclose paid links or risk a spam flag</text>
  </g>

  <text x="40" y="455" font-size="20" font-weight="700" fill="#16192A">Guest Posting vs. Niche Edits</text>
</svg>
