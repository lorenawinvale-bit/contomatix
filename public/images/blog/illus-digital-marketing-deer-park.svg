<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="475" fill="#FDFAF5"/>
  <circle cx="640" cy="80" r="140" fill="rgba(20,184,166,0.06)"/>
  <circle cx="100" cy="400" r="130" fill="rgba(249,115,22,0.06)"/>

  <g>
    <circle cx="52" cy="48" r="22" fill="#FFFFFF" stroke="#EAE0D2"/>
    <g transform="translate(30,26) scale(0.9167)">
      <path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="#0EA5A0" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.2"/>
      <circle cx="35.52" cy="13.63" r="3.1" fill="#F5A623"/>
      <circle cx="35.52" cy="13.63" r="1.1" fill="#FFFFFF"/>
      <circle cx="35.52" cy="34.37" r="3.1" fill="#14B8A6"/>
      <circle cx="35.52" cy="34.37" r="1.1" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="2" fill="#16192A"/>
    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <!-- Houston Ship Channel / petrochemical skyline along the base, Deer Park's real economic identity -->
  <g opacity="0.9">
    <rect x="0" y="392" width="760" height="83" fill="rgba(14,165,166,0.10)"/>
    <line x1="0" y1="392" x2="760" y2="392" stroke="#EAE0D2" stroke-width="2"/>
    <!-- storage tanks -->
    <rect x="30" y="360" width="34" height="32" rx="3" fill="#E5F7F1"/>
    <ellipse cx="47" cy="360" rx="17" ry="5" fill="#CFEFE8"/>
    <rect x="72" y="366" width="30" height="26" rx="3" fill="#F1EDE3"/>
    <ellipse cx="87" cy="366" rx="15" ry="4.5" fill="#E5DED0"/>
    <rect x="112" y="356" width="32" height="36" rx="3" fill="#E5F7F1"/>
    <ellipse cx="128" cy="356" rx="16" ry="5" fill="#CFEFE8"/>
    <!-- refinery stacks with flare -->
    <rect x="176" y="300" width="10" height="92" fill="#16192A" opacity="0.16"/>
    <rect x="196" y="270" width="12" height="122" fill="#16192A" opacity="0.18"/>
    <rect x="218" y="316" width="9" height="76" fill="#16192A" opacity="0.15"/>
    <path d="M202 270 q4 -14 -3 -24" stroke="#F5A623" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
    <circle cx="199" cy="244" r="3.5" fill="#F5A623" opacity="0.9"/>
    <!-- pipe rack -->
    <line x1="240" y1="380" x2="330" y2="380" stroke="#8A8371" stroke-width="3" opacity="0.5"/>
    <line x1="240" y1="388" x2="330" y2="388" stroke="#8A8371" stroke-width="3" opacity="0.4"/>
    <rect x="246" y="372" width="6" height="16" fill="#8A8371" opacity="0.5"/>
    <rect x="300" y="372" width="6" height="16" fill="#8A8371" opacity="0.5"/>
    <!-- more distant tanks/stacks fading right -->
    <rect x="580" y="340" width="30" height="52" rx="3" fill="#F1EDE3" opacity="0.8"/>
    <ellipse cx="595" cy="340" rx="15" ry="4.5" fill="#E5DED0" opacity="0.8"/>
    <rect x="618" y="352" width="26" height="40" rx="3" fill="#E5F7F1" opacity="0.8"/>
    <ellipse cx="631" cy="352" rx="13" ry="4" fill="#CFEFE8" opacity="0.8"/>
    <rect x="660" y="310" width="10" height="82" fill="#16192A" opacity="0.12"/>
    <rect x="680" y="330" width="9" height="62" fill="#16192A" opacity="0.11"/>
  </g>

  <ellipse cx="450" cy="418" rx="185" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- Home-on-a-residential-street motif: the near-miss (real house, not a staffed office), with a question mark -->
  <g transform="translate(56,150)">
    <rect x="0" y="0" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <!-- little house -->
    <rect x="35" y="52" width="80" height="46" fill="#F1EDE3"/>
    <polygon points="30,52 120,52 75,22" fill="#EAE0D2"/>
    <rect x="68" y="70" width="18" height="28" fill="#FFFFFF" stroke="#C9BBA9" stroke-width="1.4"/>
    <rect x="42" y="62" width="14" height="12" fill="#E5F7F1" stroke="#C9BBA9" stroke-width="1.2"/>
    <rect x="94" y="62" width="14" height="12" fill="#E5F7F1" stroke="#C9BBA9" stroke-width="1.2"/>
    <!-- driveway + mailbox, residential-street cue -->
    <rect x="16" y="92" width="16" height="14" fill="#E5DED0"/>
    <line x1="10" y1="86" x2="10" y2="98" stroke="#8A8371" stroke-width="2"/>
    <rect x="4" y="80" width="12" height="7" rx="2" fill="#0EA5A0" opacity="0.6"/>
    <text x="75" y="112" font-size="34" font-weight="700" fill="#C9BBA9" text-anchor="middle">?</text>
  </g>

  <g stroke="#C9BBA9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" stroke-dasharray="2,7">
    <path d="M290 240 Q312 234 330 222"/>
    <path d="M296 258 Q320 258 338 253"/>
  </g>

  <!-- floating stat cards -->
  <g>
    <rect x="420" y="150" width="280" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="447" cy="178" r="13" fill="#FDF3E2"/>
    <path d="M441 178h12M447 172v12" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="468" y="174" font-size="12.5" font-weight="700" fill="#16192A">20+ candidates checked</text>
    <text x="468" y="191" font-size="11" fill="#8A8371">zero staffed digital marketing offices found</text>
  </g>
  <g>
    <rect x="420" y="214" width="280" height="56" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="447" cy="242" r="13" fill="#E5F7F1"/>
    <path d="M441 242l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="238" font-size="12.5" font-weight="700" fill="#16192A">Harris County, TX</text>
    <text x="468" y="255" font-size="11" fill="#8A8371">on the Houston Ship Channel corridor</text>
  </g>

  <text x="56" y="450" font-size="16" font-weight="700" fill="#16192A">Digital Marketing Agencies in Deer Park, TX: The Honest Answer</text>
</svg>
