  </g>

  <!-- connected automation nodes feeding into the pipeline -->
  <g stroke="#14B8A6" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75" stroke-dasharray="1,7">
    <path d="M40 60 Q10 90 60 130"/>
