  <g>
    <rect x="430" y="325" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="456" cy="351" r="12" fill="#FDF3E2"/>
    <path d="M456 344v9m0 4v.5" stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round"/>
    <text x="475" y="347" font-size="12.5" font-weight="700" fill="#16192A">Small sites get cited too</text>
    <text x="475" y="364" font-size="11" fill="#8A8371">rank isn't a prerequisite</text>
  </g>

  <text x="140" y="425" font-size="18" font-weight="700" fill="#16192A">How to Get Cited by ChatGPT</text>
