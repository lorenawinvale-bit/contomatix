    </g>
    <text x="82" y="55" font-size="18" font-weight="700" fill="#16192A">Contomatix</text>
  </g>

  <ellipse cx="300" cy="420" rx="150" ry="14" fill="rgba(23,20,44,0.06)"/>

  <!-- page/document with a highlighted "answer capsule" at the top -->
  <g>
    <rect x="120" y="150" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="2"/>
    <rect x="140" y="172" width="190" height="40" rx="8" fill="#E5F7F1" stroke="#0EA5A0" stroke-width="1.5"/>
    <rect x="152" y="182" width="130" height="8" rx="4" fill="#0EA5A0"/>
    <rect x="152" y="196" width="160" height="8" rx="4" fill="#5FC3BC"/>
    <rect x="140" y="228" width="190" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="244" width="160" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="268" width="190" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="284" width="140" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="308" width="190" height="8" rx="4" fill="#F1EDE3"/>
    <rect x="140" y="324" width="170" height="8" rx="4" fill="#F1EDE3"/>
    <text x="140" y="164" font-size="10" font-weight="700" fill="#0B807C">ANSWER CAPSULE</text>
  </g>

  <path d="M362 240 h48" stroke="#C9BBA9" stroke-width="2" fill="none"/>
  <polygon points="404,235 416,240 404,245" fill="#C9BBA9"/>

  <!-- chat bubble result with citation -->
  <g>
    <path d="M430 190 h220 a18 18 0 0 1 18 18 v90 a18 18 0 0 1 -18 18 h-150 l-30 26 v-26 h-40 a18 18 0 0 1 -18 -18 v-90 a18 18 0 0 1 18 -18 Z" fill="#FFFFFF" stroke="#0EA5A0" stroke-width="2.5"/>
    <rect x="452" y="214" width="180" height="9" rx="4.5" fill="#F1EDE3"/>
    <rect x="452" y="230" width="150" height="9" rx="4.5" fill="#F1EDE3"/>
    <rect x="452" y="252" width="90" height="20" rx="10" fill="#FDF3E2" stroke="#F5A623"/>
    <text x="461" y="266" font-size="9.5" font-weight="700" fill="#B5730E">yoursite.com</text>
  </g>

  <!-- floating cards -->
  <g>
    <rect x="120" y="325" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#EAE0D2"/>
    <circle cx="146" cy="351" r="12" fill="#E5F7F1"/>
    <path d="M140 351l4 4 8-8" stroke="#0B807C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="347" font-size="12.5" font-weight="700" fill="#16192A">Front-load the answer</text>
    <text x="165" y="364" font-size="11" fill="#8A8371">most citations pull from the top</text>
