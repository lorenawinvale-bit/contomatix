<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;width:1280px;background:#FAF5EF}svg{display:block;width:1280px;height:auto}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="'Segoe UI',Arial,sans-serif"><rect width="1200" height="330" fill="#FAF5EF"/><text x="28" y="48" font-size="24" font-weight="800" fill="#16192A">Google's site move rules, in short</text><rect x="28" y="84" width="562" height="216" rx="14" fill="#fff" stroke="#EAE0D2" stroke-width="1.5"/><rect x="28" y="84" width="562" height="46" rx="14" fill="#FDECEC"/><rect x="28" y="114" width="562" height="16" fill="#FDECEC"/><text x="46" y="114" font-size="16" font-weight="800" fill="#E5484D">What Google says to avoid</text><circle cx="56" cy="157" r="11" fill="#FDECEC"/><text x="56" y="162" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="162" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Chaining redirects: go straight to the final destination</text><circle cx="56" cy="208.33333333333334" r="11" fill="#FDECEC"/><text x="56" y="213.33333333333334" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="213.33333333333334" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Making several changes at once: do them one at a time</text><circle cx="56" cy="259.6666666666667" r="11" fill="#FDECEC"/><text x="56" y="264.6666666666667" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="264.6666666666667" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Dropping redirects early: keep them at least 1 year</text><rect x="610" y="84" width="562" height="216" rx="14" fill="#fff" stroke="#EAE0D2" stroke-width="1.5"/><rect x="610" y="84" width="562" height="46" rx="14" fill="#E6F6F4"/><rect x="610" y="114" width="562" height="16" fill="#E6F6F4"/><text x="628" y="114" font-size="16" font-weight="800" fill="#0EA5A0">What Google says to do</text><circle cx="638" cy="157" r="11" fill="#E6F6F4"/><text x="638" y="162" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="162" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Use server-side permanent redirects such as 301 and 308</text><circle cx="638" cy="195.5" r="11" fill="#E6F6F4"/><text x="638" y="200.5" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="200.5" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Small and medium sites: move all URLs at once</text><circle cx="638" cy="234" r="11" fill="#E6F6F4"/><text x="638" y="239" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="239" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Large sites: one section at a time is fine</text><circle cx="638" cy="272.5" r="11" fill="#E6F6F4"/><text x="638" y="277.5" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="277.5" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Permanent redirects do not cause a loss in PageRank</text><defs><linearGradient id="lgr" x1="10" y1="8" x2="38" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2DD4BF"/><stop offset="0.55" stop-color="#0EA5A0"/><stop offset="1" stop-color="#0B807C"/></linearGradient><linearGradient id="lgn" x1="30" y1="9" x2="41" y2="19" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F5A623"/></linearGradient><linearGradient id="lgt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="0.55" stop-color="#0EA5A0"/><stop offset="1" stop-color="#0B807C"/></linearGradient></defs><g transform="translate(1040 16)"><g transform="scale(0.8)"><path d="M 35.52 13.63 A 15.5 15.5 0 1 0 35.52 34.37" fill="none" stroke="url(#lgr)" stroke-width="6" stroke-linecap="round"/><line x1="35.52" y1="13.63" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.7"/><line x1="35.52" y1="34.37" x2="24" y2="24" stroke="#C9BBA9" stroke-width="1.7"/><circle cx="35.52" cy="13.63" r="4.2" fill="url(#lgn)"/><circle cx="35.52" cy="13.63" r="1.5" fill="#fff"/><circle cx="35.52" cy="34.37" r="4.2" fill="#14B8A6"/><circle cx="35.52" cy="34.37" r="1.5" fill="#fff"/><circle cx="24" cy="24" r="2.4" fill="#16192A"/></g><text x="44" y="26" font-size="20" font-weight="700" font-family="'Segoe UI',Arial,sans-serif" letter-spacing="-0.3"><tspan fill="#16192A">Conto</tspan><tspan fill="url(#lgt)">matix</tspan></text></g></svg></body></html>
