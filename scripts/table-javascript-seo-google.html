idth="562" height="46" rx="14" fill="#FDECEC"/><rect x="28" y="114" width="562" height="16" fill="#FDECEC"/><text x="46" y="114" font-size="16" font-weight="800" fill="#E5484D">What Google says does not work</text><circle cx="56" cy="157" r="11" fill="#FDECEC"/><text x="56" y="162" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="162" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Links with javascript:goTo in the href</text><circle cx="56" cy="195.8" r="11" fill="#FDECEC"/><text x="56" y="200.8" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="200.8" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">URL fragments to load different content</text><circle cx="56" cy="234.6" r="11" fill="#FDECEC"/><text x="56" y="239.6" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="239.6" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Blocked scripts: Google will not render them</text><circle cx="56" cy="273.4" r="11" fill="#FDECEC"/><text x="56" y="278.4" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="278.4" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">JavaScript that changes the canonical URL</text><circle cx="56" cy="312.2" r="11" fill="#FDECEC"/><text x="56" y="317.2" font-size="13" font-weight="800" fill="#E5484D" text-anchor="middle">✕</text><text x="78" y="317.2" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Dynamic rendering as a long-term fix</text><rect x="610" y="84" width="562" height="256" rx="14" fill="#fff" stroke="#EAE0D2" stroke-width="1.5"/><rect x="610" y="84" width="562" height="46" rx="14" fill="#E6F6F4"/><rect x="610" y="114" width="562" height="16" fill="#E6F6F4"/><text x="628" y="114" font-size="16" font-weight="800" fill="#0EA5A0">What Google says works</text><circle cx="638" cy="157" r="11" fill="#E6F6F4"/><text x="638" y="162" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="162" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Anchor elements with an href, even if injected by script</text><circle cx="638" cy="195.8" r="11" fill="#E6F6F4"/><text x="638" y="200.8" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="200.8" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">The History API for routing</text><circle cx="638" cy="234.6" r="11" fill="#E6F6F4"/><text x="638" y="239.6" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="239.6" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Meaningful status codes, such as 404</text><circle cx="638" cy="273.4" r="11" fill="#E6F6F4"/><text x="638" y="278.4" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="278.4" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Server-side rendering, static rendering or hydration</text><circle cx="638" cy="312.2" r="11" fill="#E6F6F4"/><text x="638" y="317.2" font-size="13" font-weight="800" fill="#0EA5A0" text-anchor="middle">✓</text><text x="660" y="317.2" font-size="14" fill="#16192A" font-weight="500" text-anchor="start">Testing with the URL Inspection Tool</text></g></svg></body></html>
